name: 1.21.11 game smoke
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        task: [runGameTest, runClientGameTest]
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Run native receiver GameTest
        run: xvfb-run -a ./gradlew -PtaczGameTests "${{ matrix.task }}" --console=plain --no-daemon
      - name: Check in-game receipts
        run: |
          if [ "${{ matrix.task }}" = runClientGameTest ]; then
            grep -F 'PORT_12111_CLIENT: live world' build/run/clientGameTest/logs/latest.log
            find build/run/clientGameTest/screenshots -name '*tacz_12111_catalog_and_viewmodel*.png' | grep -q .
          else
            grep -F 'PORT_CATALOG:' build/run/gameTest/logs/latest.log
            grep -F 'PORT_SETTLEMENT:' build/run/gameTest/logs/latest.log
            grep -F 'PORT_STORAGE:' build/run/gameTest/logs/latest.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-12111-${{ matrix.task }}-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/**/logs/latest.log
            build/run/**/crash-reports/*.txt
            build/run/**/screenshots/**/*.png
