name: api-probe
# 临时流程（用后即删）：把 26.2 合并 jar 里与皮肤/档案相关的类 dump 出来，
# 写回 build-reports/api-probe.txt —— 沙箱里没有可读的 26.2 jar，Actions 日志又取不回来。
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies (probe file fails to compile, that is expected)
        run: ./gradlew compileJava --console=plain --no-daemon || true

      - name: Dump skin/profile classes
        run: |
          set -x
          OUT=build-reports/api-probe.txt
          mkdir -p build-reports
          : > "$OUT"
          echo "== jars ==" >> "$OUT"
          JARS=$(find ~/.gradle -name "*.jar" | grep -iE "minecraft" | grep -viE "sources|javadoc" || true)
          echo "$JARS" >> "$OUT"
          JAR=$(echo "$JARS" | head -1)
          if [ -z "$JAR" ]; then
            echo "NO JAR FOUND" >> "$OUT"
            find ~/.gradle -name "*.jar" | head -50 >> "$OUT"
            exit 0
          fi
          echo "== using $JAR ==" >> "$OUT"
          echo "== class list (skin/profile) ==" >> "$OUT"
          unzip -l "$JAR" | awk '{print $4}' | grep -iE "PlayerSkin|SkinCache|SkinRender|SkinManager|ResolvableProfile|ProfileContents|GameProfileCache|NameAndId" | sort >> "$OUT"
          for C in \
            net.minecraft.client.renderer.PlayerSkinRenderCache \
            'net.minecraft.client.renderer.PlayerSkinRenderCache$RenderInfo' \
            net.minecraft.world.entity.player.PlayerSkin \
            'net.minecraft.world.entity.player.PlayerSkin$Patch' \
            net.minecraft.server.players.ProfileResolver \
            net.minecraft.world.level.block.entity.SkullBlockEntity \
            net.minecraft.client.renderer.blockentity.state.SkullBlockRenderState \
            'net.minecraft.world.item.component.ResolvableProfile$Partial' \
            'net.minecraft.world.item.component.ResolvableProfile$Static' \
            net.minecraft.world.item.component.ResolvableProfile
          do
            echo "== javap $C ==" >> "$OUT"
            javap -classpath "$JAR" "$C" >> "$OUT" 2>&1 || true
          done
          echo "== Minecraft: skin-related members ==" >> "$OUT"
          javap -p -classpath "$JAR" net.minecraft.client.Minecraft 2>&1 | grep -iE "skin|profile" >> "$OUT" || true
          echo "== SkullBlockRenderer: how it uses the cache (bytecode refs) ==" >> "$OUT"
          javap -p -c -classpath "$JAR" net.minecraft.client.renderer.blockentity.SkullBlockRenderer 2>&1 | grep -iE "PlayerSkinRenderCache|ResolvableProfile|SkinManager|DefaultPlayerSkin|getOrDefault|createLookup|lookup" >> "$OUT" || true
          echo "== PlayerSkinRenderCache: private members ==" >> "$OUT"
          javap -p -classpath "$JAR" net.minecraft.client.renderer.PlayerSkinRenderCache >> "$OUT" 2>&1 || true
          echo "== authlib GameProfile (constructor null checks) ==" >> "$OUT"
          AJAR=$(find ~/.gradle -name "authlib-*.jar" | grep -v sources | head -1)
          echo "authlib jar: $AJAR" >> "$OUT"
          if [ -n "$AJAR" ]; then javap -p -c -classpath "$AJAR" com.mojang.authlib.GameProfile 2>&1 | head -80 >> "$OUT"; fi
          echo "== BlockEntityRendererProvider\$Context ==" >> "$OUT"
          javap -p -classpath "$JAR" 'net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider$Context' >> "$OUT" 2>&1 || true
          echo "== EntityRendererProvider\$Context ==" >> "$OUT"
          javap -p -classpath "$JAR" 'net.minecraft.client.renderer.entity.EntityRendererProvider$Context' >> "$OUT" 2>&1 || true
          echo "== SkullBlockEntity: profile keys in bytecode ==" >> "$OUT"
          javap -p -c -classpath "$JAR" net.minecraft.world.level.block.entity.SkullBlockEntity 2>&1 | grep -iE "ResolvableProfile|profile|Owner" | head -30 >> "$OUT" || true
          echo "== done ==" >> "$OUT"

      - name: Push probe output back via contents API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=build-reports/api-probe.txt
          [ -f "$LOG" ] || echo "no output" > "$LOG"
          BRANCH="${{ github.ref_name }}"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                -f message="ci-log: api probe for ${{ github.sha }}"
                -f branch="$BRANCH"
                -f content="$(base64 -w0 "$LOG")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" --jq .commit.sha
