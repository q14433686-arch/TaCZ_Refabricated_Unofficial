name: compile-check
# Read-only: diagnostics go to the check, never to a new commit on the tested branch.
permissions:
  contents: read
on:
  push:
    branches:
      - 'arena/**'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    # 防止“日志回推 commit”再次触发本流程造成死循环
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:
concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile for Minecraft 26.1.2
        run: |
          set -o pipefail
          ./gradlew --init-script scripts/ci-central.init.gradle compileJava --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/compile.log"
      - name: Report diagnostics without writing back to the tested branch
        if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/compile.log"
