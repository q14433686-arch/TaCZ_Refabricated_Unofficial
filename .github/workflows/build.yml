name: build

# 全量构建 + 产物上传（2026-08-31 新增）：
# compile-check 只跑 compileJava，测不出 processResources / remapJar 阶段的失败，
# 也不产 jar。本流程跑 ./gradlew build 并把 jar 上传为 Actions artifact（留 14 天）——
# 直接用途：给 NV 卡征测者一个下载链接；每轮改动随手有可实测的构建。
# 同时运行 mixin / 语言 / 版本与 26.3 方块接线检查，以及隔离桩回归测试。

permissions:
  contents: read

on:
  push:
    branches:
      - 'arena/**'
      - '26.2(main)'
      - '26.3'
      - '26.1.2'
      - '1.21.11'
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mixin config integrity (json 里列的类必须真实存在)
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          bad = []
          for cfg in glob.glob('src/main/resources/*mixins*.json'):
              d = json.load(open(cfg))
              pkg = d.get('package', '').replace('.', '/')
              for section in ('mixins', 'client', 'server'):
                  for m in d.get(section, []):
                      p = 'src/main/java/' + pkg + '/' + m.replace('.', '/') + '.java'
                      if not os.path.exists(p):
                          bad.append(f'{cfg}: {m} -> {p} 不存在')
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          EOF

      - name: Lang key parity (en_us 与 zh_cn 键集合必须一致)
        run: |
          python3 - <<'EOF'
          import json, sys
          bad = []
          for ns in ('tacz', 'lrtactical'):
              base = f'src/main/resources/assets/{ns}/lang/'
              en = set(json.load(open(base + 'en_us.json')))
              zh = set(json.load(open(base + 'zh_cn.json')))
              for k in sorted(en - zh):
                  bad.append(f'{ns}: {k} 只在 en_us')
              for k in sorted(zh - en):
                  bad.append(f'{ns}: {k} 只在 zh_cn')
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          EOF

      - name: Block drop wiring (26.3 loot schema)
        run: python3 scripts/verify_block_drops.py --strict

      - name: Block entity persistence and target skin wiring
        run: python3 scripts/verify_block_entity_persistence.py --strict

      - name: Version consistency (与 consistency.yml 同一脚本，arena 分支也守门)
        run: bash scripts/check_release_consistency.sh --strict

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Block and target regression tests (isolated Minecraft API doubles)
        run: |
          python3 scripts/verify_recipe_viewer_reload.py
          python3 scripts/test_block_guards.py
          python3 scripts/test_block_entities.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Full build
        run: |
          set -o pipefail
          ./gradlew build --console=plain --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/tacz-build.log"

      - name: Verify server smoke and nested MAE
        run: |
          grep -F 'PORT_SMOKE_SERVER: 26.3 overlay and tacz:ak47 loaded' build/run/gameTest/logs/latest.log
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar, = [p for p in Path('build/libs').glob('*.jar') if not p.name.endswith('-sources.jar')]
          with zipfile.ZipFile(jar) as z:
              deps = [n for n in z.namelist() if n.startswith('META-INF/jars/mae-')]
              assert deps == ['META-INF/jars/mae-1.1.4.jar'], deps
              assert [j['file'] for j in json.loads(z.read('fabric.mod.json'))['jars']].count(deps[0]) == 1
              assert not any('/guns/test/' in n or n.endswith('tacz-port-smoke.zip') for n in z.namelist())
              print('::notice::' + jar.name + ' contains one registered ' + deps[0] + '; server overlay smoke passed')
          PY

      - name: Client smoke (Mesa software rendering, integrated world and held gun)
        timeout-minutes: 12
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew -PtaczClientSmoke runClientGameTest --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/tacz-client.log"
          test -s "$(find build/run/clientGameTest/screenshots -name '*tacz_held_default_gun.png' -print -quit)"

      - name: Annotate smoke or JUnit failures (also available via Checks API)
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          def message(s):
              print('::error::' + s[:1600].strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for p in Path('build/test-results/test').glob('*.xml'):
              for f in ET.parse(p).iter('failure'): message(f.get('message', 'JUnit failure'))
          for p in [*Path('build/run').glob('*/logs/latest.log'), *Path(os.environ['RUNNER_TEMP']).glob('tacz-*.log')]:
              hits = [s for s in p.read_text(errors='replace').splitlines() if re.search(r'Caused by:|Exception|Error|error:|FAILED|timed out|renderer|Failed to|Assertion', s, re.I)]
              for s in list(dict.fromkeys(hits))[-8:]: message(p.name + ': ' + s)
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.sha }}
          path: |
            build/run/gameTest/logs/latest.log
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          # 注意:artifact 名不能含 '/' 等字符,所以这里不能用 github.ref_name
          # (arena/xxx 带斜杠,首跑 2026-08-31 就是这样失败的)。分支名在 run
          # 页面本来就有,名字里只放 sha 前缀即可。
          name: TACZ-Refabricated-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 14
          if-no-files-found: error
