name: PAL third-person runtime
on:
  push:
    branches: ['arena/**', '26.3']
    paths: &pal-paths ['src/**/playeranimator/**', 'src/**/InnerThirdPersonManager.java', 'src/**/PlayerModelMixin.java', 'src/**/PalRuntimeSmoke.java', 'src/**/PackClientSmoke.java', 'scripts/run_client_smoke.sh', '.github/workflows/animation-smoke.yml', 'build.gradle']
  pull_request:
    paths: *pal-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/install_client_smoke_deps.sh
      - name: Activate PAL and turn away from and back to a moving animation
        env: {SDL_VIDEO_DRIVER: x11, LIBGL_ALWAYS_SOFTWARE: 'true', ALSOFT_DRIVERS: 'null', TACZ_SMOKE_PAL: 'true'}
        run: xvfb-run -a bash scripts/run_client_smoke.sh
      - if: failure()
        run: |
          for file in "$RUNNER_TEMP/tacz-client.log" build/run/clientGameTest/logs/latest.log; do
            if test -f "$file"; then grep -Ei 'Caused by:|error:|AssertionError|Could not|requires |Failed to' "$file" | tail -12 | cut -c1-500 | sed 's/^/::notice::/' || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pal-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/*_tacz_pal_*.png
            ${{ runner.temp }}/tacz-client.log
