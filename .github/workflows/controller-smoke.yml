name: Controllable runtime
on:
  push:
    branches: ['arena/**', '26.2(main)']
    paths: &controller-paths
      - 'src/**/controllable/**'
      - 'src/**/input/**'
      - 'src/**/ControllerSmoke.java'
      - 'src/**/PackClientSmoke.java'
      - 'src/**/fabric.mod.json'
      - 'src/**/GunInputHandler.java'
      - 'src/**/MinecraftMixin.java'
      - 'gradle.properties'
      - 'scripts/ci-central.init.gradle'
      - '.github/workflows/controller-smoke.yml'
      - 'build.gradle'
  pull_request:
    paths: *controller-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Controllable on the target client
        env: {LIBGL_ALWAYS_SOFTWARE: 'true', ALSOFT_DRIVERS: 'null'}
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew --init-script scripts/ci-central.init.gradle -PtaczClientSmoke -PtaczControllerSmoke runClientGameTest --console=plain 2>&1 | tee "$RUNNER_TEMP/tacz-client.log"
          grep -F 'PORT_CONTROLLER: installed mod polled an SDL2 virtual gamepad' build/run/clientGameTest/logs/latest.log | sed 's/^/::notice::/'
      - if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/tacz-client.log" build/run/clientGameTest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/clientGameTest/logs/latest.log
            ${{ runner.temp }}/tacz-client.log
