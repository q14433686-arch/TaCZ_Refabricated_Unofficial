name: recipe viewer runtimes
on:
  push:
    branches: ['arena/**', '26.2(main)']
    paths: &viewer-paths
      - 'src/**/compat/jei/**'
      - 'src/**/compat/rei/**'
      - 'src/**/compat/recipeviewer/**'
      - 'src/**/RecipeViewerReloadBridge.java'
      - 'src/**/mixin/client/compat/jei/**'
      - 'src/**/network/message/ServerMessageSyncGunPack*.java'
      - 'src/**/fabric.mod.json'
      - 'src/gametest/**/*ViewerSmoke.java'
      - 'src/gametest/**/ConversionReloadSmoke.java'
      - 'src/main/java/com/tacz/guns/resource/**'
      - 'src/main/resources/assets/tacz/custom/**'
      - 'src/gametest/fixtures/**'
      - 'src/gametest/**/PackClientSmoke.java'
      - 'scripts/ci-central.init.gradle'
      - '.github/workflows/viewer-smoke.yml'
      - 'gradle.properties'
      - 'build.gradle'
  pull_request:
    paths: *viewer-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewer: [jei, rei]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Query and open the reloaded page on 26.2
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
          VIEWER: ${{ matrix.viewer }}
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew --init-script scripts/ci-central.init.gradle -PtaczClientSmoke -PtaczViewerSmoke="$VIEWER" runClientGameTest --console=plain 2>&1 | tee "$RUNNER_TEMP/tacz-client.log"
          log=build/run/clientGameTest/logs/latest.log
          grep -F "PORT_VIEWER: $VIEWER showed the reloaded gun" "$log"
          grep -F 'three output searches and specialist blacklist passed (reloaded=true)' "$log"
          if [[ $VIEWER == rei ]]; then grep -F 'reload_smoke:paper]' "$log" | grep -F PORT_REI_CRAFTING; fi
      - name: Summarize failures
        if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/tacz-client.log" build/run/clientGameTest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-${{ matrix.viewer }}-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/run/clientGameTest/crash-reports/*.txt
            ${{ runner.temp }}/tacz-client.log
