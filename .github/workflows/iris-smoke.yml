name: Iris thermal regression
on:
  push:
    branches: ['arena/**', '26.3']
    paths: ['src/**', 'build.gradle', 'scripts/*iris*', 'scripts/run_client_smoke.sh', 'scripts/ci-central.init.gradle', '.github/workflows/iris-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iris-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iris:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: iris, color: '' }
          - { artifact: reimagined-off, color: '0' }
          - { artifact: reimagined-act, color: '128' }
    env:
      TACZ_IRIS_COLOR: ${{ matrix.color }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/prepare_iris_smoke.py
      - run: bash scripts/install_client_smoke_deps.sh
        env:
          TACZ_SMOKE_IRIS: 'true'
      - name: Real Iris and Sodium with the selected active shader pack (OpenGL software)
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
          TACZ_SMOKE_IRIS: 'true'
          SDL_VIDEO_FORCE_EGL: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 +extension GLX +render -noreset' bash -c 'glxinfo -B; bash scripts/run_client_smoke.sh'
      - name: Report real-pack pixel and shadow measurements
        if: always() && matrix.color != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log=Path('build/run/clientGameTest/logs/latest.log')
          if log.exists():
            lines=log.read_text(errors='replace').splitlines()
            for name,keys in [('Setup',('Complementary','depth readback')),('Shadow',('shadow ',)),('Bounds',('caster bounds','translated caster','removed caster')),('Light',('ambient=','stock locator','same stock','timed exposure')),('Aperture',('PORT_SCOPE_PARTICLE:',))]:
              data=[s.split(') ',1)[-1] for s in lines if ('PORT_REIMAGINED:' in s or 'PORT_SCOPE_PARTICLE:' in s) and any(k in s for k in keys)]
              if data: print('::notice title='+name+'::'+' | '.join(data).replace('%','%25'))
          PY
      - name: Summarize failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          for p in [Path(os.environ['RUNNER_TEMP'])/'tacz-client.log',Path('build/run/clientGameTest/logs/latest.log')]:
            if not p.exists(): continue
            lines=p.read_text(errors='replace').splitlines()
            for s in lines:
              if re.search("PORT_REIMAGINED|profile.*custom|Using shaderpack|Failed to load shaderpack|assign.*illuminated|program match for tacz:pipeline/(?:illuminated|muzzle)|ShaderCompileException",s,re.I): print("::notice::"+s[:1600].replace("%","%25"))
            failures=[i for i,s in enumerate(lines) if re.search('AssertionError|Client gametests failed|Caused by:|error:',s)]
            for i in failures[-3:]: print('::error::'+' '.join(lines[i:i+5])[:2500].replace('%','%25'))
            for i in [i for i,s in enumerate(lines) if re.search('com[.]tacz[.]guns[.]test[.]|PORT_|Heat capture|Pack lens|Caused by:|error:|AssertionError|Failed|Exception|requires ',s)][-16:]:
              print('::notice::'+' '.join(lines[i:i+5])[:1800].replace('%','%25'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/iris-smoke/manifest.json
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/run/clientGameTest/diagnostics/*.txt
            build/run/clientGameTest/crash-reports/*.txt
