name: Iris thermal regression
on:
  push:
    branches: ['arena/**', '26.3']
    paths: ['src/**', 'build.gradle', 'scripts/*iris*', 'scripts/run_client_smoke.sh', '.github/workflows/iris-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iris-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iris:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/prepare_iris_smoke.py
      - run: bash scripts/install_client_smoke_deps.sh
        env:
          TACZ_SMOKE_IRIS: 'true'
      - name: Real Iris and Sodium with an active authored shader pack (OpenGL software)
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
          TACZ_SMOKE_IRIS: 'true'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 +extension GLX +render -noreset' bash -c 'glxinfo -B; bash scripts/run_client_smoke.sh'
      - name: Summarize failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          for p in [Path(os.environ['RUNNER_TEMP'])/'tacz-client.log',Path('build/run/clientGameTest/logs/latest.log')]:
            if not p.exists(): continue
            lines=p.read_text(errors='replace').splitlines()
            for i in [i for i,s in enumerate(lines) if re.search('Caused by:|error:|AssertionError|Failed|Exception|requires ',s)][-15:]:
              print('::notice::'+' '.join(lines[i:i+3])[:1800].replace('%','%25'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-${{ github.sha }}
          path: |
            build/iris-smoke/manifest.json
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/run/clientGameTest/diagnostics/*.txt
            build/run/clientGameTest/crash-reports/*.txt
