name: 26.1.2 ADS on Complementary r5.8.1
on:
  push:
    branches: ['arena/**', '26.1.2']
    paths: ['src/main/java/com/tacz/guns/client/**', 'src/main/java/com/tacz/guns/compat/iris/**', 'src/main/java/com/tacz/guns/mixin/client/**', 'src/main/resources/**/attachments/**', 'src/main/resources/**/shaders/**', 'src/gametest/**', 'gradle.properties', 'build.gradle', 'scripts/prepare_iris_smoke.py', '.github/workflows/shader-optics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shader-optics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ads:
    strategy:
      fail-fast: false
      matrix:
        suite: [scopes, sights, pip, thermal-narrow, thermal-reap, thermal-xl50, report-size, report-marks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TACZ_OPTIC_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/prepare_iris_smoke.py
      - name: Render real ADS views
        env:
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '4.6'
          MESA_GLSL_VERSION_OVERRIDE: '460'
          ALSOFT_DRIVERS: 'null'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 2600x1500x24 +extension GLX +render -noreset' ./gradlew --init-script scripts/ci-central.init.gradle -PtaczClientSmoke -PwithIris -PtaczOpticSuite="$TACZ_OPTIC_SUITE" runClientGameTest --console=plain 2>&1 | tee "$RUNNER_TEMP/ads.log"
          grep -F "OPTIC_COMPLETE: $TACZ_OPTIC_SUITE" build/run/clientGameTest/logs/latest.log
      - name: Per-view framebuffer receipts
        if: always()
        run: |
          log=build/run/clientGameTest/logs/latest.log
          if [[ -f $log ]]; then
            grep -E 'OPTIC_(PACK|FRAME|HEAT|COMPLETE):' "$log" | tee -a "$GITHUB_STEP_SUMMARY" || true
            # Checks truncate a single long annotation. Keep all slots and angle controls readable.
            python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          rows=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for tag in ('PACK','FRAME','HEAT','TRACE','COMPLETE'):
              marker='OPTIC_'+tag+': '
              data=[s.split(marker,1)[1] for s in rows if marker in s]
              for i in range(0,len(data),10): print('::notice title='+tag+'::'+' | '.join(data[i:i+10]))
          PY
          fi
      - if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/ads.log" build/run/clientGameTest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 14
          name: ads-r581-${{ matrix.suite }}-${{ github.sha }}
          path: |
            build/iris-smoke/manifest.json
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/run/clientGameTest/crash-reports/*.txt
