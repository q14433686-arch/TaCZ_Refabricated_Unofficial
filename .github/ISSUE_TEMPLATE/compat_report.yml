name: 内容包 / 兼容性问题
description: 第三方枪包、战术包或可选 mod 的兼容问题
title: "[Compat] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        **请先阅读**：本仓库只处理 **Fabric 移植**的兼容性问题；NeoForge 移植版
        （[TaCZ_Renovated](https://github.com/q14433686-arch/TaCZ_Renovated)）的兼容问题
        请到该仓库提交。
        紫黑贴图或模型缺失**不能**证明该包依赖 Arcana，
        也可能是目录层级、资源路径、版本谓词或包本身不完整造成的。
        明确依赖 Arcana 的内容不受支持（Arcana 官方仅提供 1.20.1 Forge 文件）。

        **维护状态公告（2026-11-27）**：本项目整体从「积极维护」转为**不定时更新**。仅 **1.21.11 与 26.3** 仍接收更新；**26.1.2 与 26.2 已封存**，已发布的 Release 继续可用，Issue 仍可提交，但不承诺修复。有意接手维护的开发者可随意 fork（代码 GPL-3.0；默认枪包资源 CC BY-NC-ND 4.0，再分发仍受约束）。
        **Maintenance:** Updates are irregular. Only 1.21.11 and 26.3 still receive updates; 26.1.2/26.2 are archived. Existing releases remain available and issues stay open, but fixes are not promised. Forks are welcome under the existing code and asset licenses.

  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft 版本
      description: 1.21.11 与 26.3 不定时更新；26.1.2、26.2 已封存，仍可提交 Issue，但不承诺修复。
      options:
        - "26.3"
        - "1.21.11"
        - "26.2"
        - "26.1.2"
    validations:
      required: true

  - type: input
    id: pack_name
    attributes:
      label: 内容包 / mod 的准确名称与版本
      description: 请给出准确包名和版本号，不要只写「某个枪包」
    validations:
      required: true

  - type: input
    id: pack_source
    attributes:
      label: 该包的下载来源链接
    validations:
      required: true

  - type: textarea
    id: pack_deps
    attributes:
      label: 该包作者列出的前置依赖
      description: 请照抄作者发布页写明的依赖列表
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 具体表现与复现步骤
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 完整 latest.log
      render: text
    validations:
      required: true
