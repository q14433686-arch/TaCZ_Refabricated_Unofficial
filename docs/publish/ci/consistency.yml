name: Version consistency

# 版本一致性守门：改了 gradle.properties 却忘了同步 README 时，PR 会红。
# 只在 PR 与三条正式分支上把关；功能分支的中间提交不受影响。
on:
  push:
    branches:
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'scripts/check_release_consistency.sh'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'README.md'
      - 'scripts/check_release_consistency.sh'
  workflow_dispatch:

jobs:
  check:
    name: README 与 gradle.properties 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --strict：不一致时返回 1，让 PR 变红。
      # 这是「合并前必须收尾」的门禁；本地 pre-commit 只提醒、不阻断。
      - name: 检查当前分支
        run: bash scripts/check_release_consistency.sh --strict

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::README.md 与 gradle.properties 的版本号不一致。"
          echo "::error::请参考 AGENTS.md §1 与 docs/publish/RELEASE_CHECKLIST.md 同步以下位置："
          echo "::error::顶部版本句 / 「已使用 R? 版本号」提示行 / 支持环境表 / 导航表 tag 链接 / SemVer 说明段"
