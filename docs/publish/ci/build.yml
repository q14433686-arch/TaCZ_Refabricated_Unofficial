name: Build

# Compile + remap + package on every push/PR.
# This is the real "does this revision build?" gate.
# It does NOT launch a Minecraft client (no GPU / no interactive session).
# Optional dedicated-server smoke is a separate job and may be skipped if
# Mojang asset endpoints flake.

on:
  push:
    branches:
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.githooks/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Gradle build (Java 25 / MC 26.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile, remap, and package
        run: ./gradlew build --stacktrace --no-daemon --warning-mode all
        env:
          # Keep CI memory in the same ballpark as loom run configs.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8'

      - name: Assert remapped jar exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/TACZ-Refabricated-*.jar)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo '::error::build/libs 里没有 TACZ-Refabricated-*.jar，Gradle build 没有产出制品。'
            ls -la build/libs || true
            exit 1
          fi
          echo 'Produced jars:'
          ls -lh "${jars[@]}"
          # Sources / -dev jars are fine; at least one non-sources remapped jar must exist.
          main=0
          for j in "${jars[@]}"; do
            case "$j" in
              *-sources.jar|*-dev.jar) ;;
              *) main=1; echo "main artifact: $j" ;;
            esac
          done
          if [[ "$main" -ne 1 ]]; then
            echo '::error::只有 sources/dev jar，缺少可分发的 remap 制品。'
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tacz-refabricated-${{ github.sha }}
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  server-smoke:
    name: Dedicated server smoke (nogui)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Honest scope: dedicated server process only. Not a client launch.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare server run dir
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          # Avoid interactive world prompts if the server reaches that far.
          printf 'online-mode=false\nsync-chunk-writes=false\n' > run/server.properties

      - name: Launch loom runServer until Done or fail
        run: bash scripts/ci_server_smoke.sh
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8'
