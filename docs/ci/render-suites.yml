name: 26.1.2 native materials and effects
on:
  workflow_dispatch:
  push:
    branches: ['arena/**', '26.1.2']
    paths: &paths
      - 'src/main/**'
      - 'src/gametest/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/render-suites.yml'
  pull_request:
    branches: ['26.1.2']
    paths: *paths
permissions: {contents: read}
concurrency:
  group: render-suites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: {suite: [muzzle, particles, readouts, receivers, tracers, displays]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Measure native draw submissions and pixels
        env: {SUITE: '${{ matrix.suite }}', LIBGL_ALWAYS_SOFTWARE: 'true', ALSOFT_DRIVERS: 'null'}
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 2600x1500x24' ./gradlew --init-script scripts/ci-central.init.gradle -PtaczClientSmoke -PtaczRenderSuite="$SUITE" runClientGameTest --console=plain 2>&1 | tee "$RUNNER_TEMP/render.log"
          grep -F "PORT_RENDER: $SUITE complete" build/run/clientGameTest/logs/latest.log
      - if: always()
        run: grep -E 'PORT_(RENDER|MUZZLE|MATERIALS|PARTICLE|HAND_|RECEIVER|RACK|SNOWSTORM|SURFACE|IMPACT|OPTIC|WORLD_TRACER|FRAGMENTS|FEEDBACK|TARGET_POSE|CASE_HINT|OUTLINE|SMOKE_CLIENT)' build/run/clientGameTest/logs/latest.log | sed 's/^/::notice::/' || true
      - if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/render.log" build/run/clientGameTest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.suite }}-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
