name: compile-check

# ---------------------------------------------------------------------------
# 【26.1.2 线副本（2026-09-02 同步自 26.2 线 docs/ci/）】
# 本文件是按 26.2 线的正式件镜像过来的，差异只有：
#   - 触发分支表保持原样（已含 26.1.2）；
#   - Java 25（26.x 构建目标，与 26.1.2 的 build.gradle targetJavaVersion 一致）；
#   - 本分支无 Loom remap，可选依赖走 cursemaven/modrinth（Actions 出网可达）。
# 维护者在网页端上线后，本目录的副本即正式件的镜像，下次改动继续在这里迭代。
# ---------------------------------------------------------------------------
# 编译验证闭环（v4）：
# 依赖下载与编译在 GitHub Actions（外网畅通）执行；
# arena/** 分支上，编译日志通过 GitHub Contents API 写回本分支
# （build-reports/compile-java.log），供网络受限的沙箱用 `gh api contents`
# 直接读取 —— 绕开 Actions 日志 blob 域不可达的限制。
# v2 用 git commit+push 回推，曾因 rebase/push 竞争 5 次失败；v3 改用 API 单文件写入。
# v4（2026-08-31）：补主分支盲区 —— 此前只有 arena/** 触发，PR 合并进
# 26.2(main) 等主分支的合并 commit 从来没人编译过。现在主分支 push 与 PR 也编译，
# 但【只有 arena/** 才回推日志】（主分支不能被 CI 提交污染，状态看 Actions 即可）。

permissions:
  contents: write

on:
  push:
    branches:
      - 'arena/**'
      - '26.2(main)'
      - '26.1.2'
      - '1.21.11'
    # 防止“日志回推 commit”再次触发本流程造成死循环
    paths-ignore:
      - 'build-reports/**'
  pull_request:
    paths-ignore:
      - 'build-reports/**'
  workflow_dispatch:

concurrency:
  # 同一分支的过期 run 直接取消，省配额（push 连发时只编最新的）
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: compileJava
        run: |
          mkdir -p build-reports
          echo "commit: ${{ github.sha }}" > build-reports/compile-java.log
          ./gradlew compileJava --console=plain --stacktrace --no-daemon >> build-reports/compile-java.log 2>&1

      - name: Push compile log back via contents API
        # 只在 arena/** 的 push 上回推 —— 主分支与 PR 不产生 ci-log commit
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 日志可能很大，只保留头 200 行 + 尾 800 行
          LOG=build-reports/compile-java.log
          LINES=$(wc -l < "$LOG")
          if [ "$LINES" -gt 1000 ]; then
            { head -n 200 "$LOG"; echo "...[truncated ${LINES} lines total]..."; tail -n 800 "$LOG"; } > /tmp/log-trimmed
            mv /tmp/log-trimmed "$LOG"
          fi
          echo "" >> "$LOG"
          echo "== job status: ${{ job.status }} ==" >> "$LOG"
          BRANCH="${{ github.ref_name }}"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$LOG?ref=$BRANCH" --jq .sha 2>/dev/null || true)
          ARGS=(-X PUT "repos/${{ github.repository }}/contents/$LOG"
                -f message="ci-log: compile result (${{ job.status }}) for ${{ github.sha }}"
                -f branch="$BRANCH"
                -f content="$(base64 -w0 "$LOG")")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api "${ARGS[@]}" --jq .commit.sha
