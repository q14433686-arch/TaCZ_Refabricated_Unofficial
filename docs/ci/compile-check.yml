name: compile-check

# TACZ-INDUSTRIAL 编译验证闭环：
# 沙箱网络白名单不可达 Gradle/Maven，故编译级验收在 GitHub Actions（外网畅通）执行，
# 由 gh CLI 读取日志并迭代修复（对应 docs/design/18-open-questions.md 的 Q-21）。

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: compileJava
        run: ./gradlew compileJava --stacktrace --console=plain --no-daemon

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: |
            **/build/reports/**
            **/build/tmp/compileJava/**
          retention-days: 7
