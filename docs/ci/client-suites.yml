name: 26.2 gameplay and renderer
on:
  push:
    branches: ['arena/**', '26.2(main)']
    paths: &paths ['src/**', 'tools/player-acceptance-pack/**', 'build.gradle', 'scripts/ci-central.init.gradle', '.github/workflows/client-suites.yml']
  pull_request:
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: target-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        suite: [actions, optics, effects, light]
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run native 26.2 client controls
        run: |
          set -o pipefail
          xvfb-run -a ./gradlew --init-script scripts/ci-central.init.gradle -PtaczClientSmoke -PtaczClientSuite="$SUITE" runClientGameTest --console=plain 2>&1 | tee "$RUNNER_TEMP/tacz-client.log"
          grep -F "PORT_TARGET_SUITE: $SUITE complete" build/run/clientGameTest/logs/latest.log
      - if: failure()
        run: python3 scripts/report_ci_failures.py "$RUNNER_TEMP/tacz-client.log" build/run/clientGameTest/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 26.2-${{ matrix.suite }}-${{ github.sha }}
          retention-days: 7
          path: |
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/screenshots/**/*.png
            build/run/clientGameTest/crash-reports/*.txt
