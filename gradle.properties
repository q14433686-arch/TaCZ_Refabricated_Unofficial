# Reconstructed from build.gradle and the upstream 26.2 artifact repositories.
# Versions are pinned so that the build is reproducible; see AUDIT_REPORT.md for verification date/source.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.155.2+26.2

# Project
# 1.2.0 是这条非官方移植的行为基线；26.2 / R1 标在 SemVer 构建元数据中。
# 枪包的 dependencies.tacz 比较核心版本：>=1.1.8 和 [1.2.0] 匹配，精确 1.1.8 不匹配。
# 不要写成 1.2.0-fabric...（预发布版低于 1.2.0），也不要改内置枪包自己的版本/署名。
# 后续 hotfix 序号仍直接接在 hotfix 后，如 R1-hotfix2，不用 hotfix.2 或 hotfix-2。
mod_version=1.2.0+fabric.26.2.R1
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

# Optional integration compile dependencies
jei_version=30.13.0.86
cloth_config_fabric=26.2.155
modmenu_version=20.0.1
player_animation_lib=1.2.5
zoomify_version=2.16.1+26.2
rei_version=26.2.820
# Optional third-person camera compatibility (Fabric 26.2 release, plugin API 5.x)
shoulder_surfing_version=26.2-5.0.7+fabric
# Architectury has no 26.2 build and no source imports require it.  This legacy
# value only keeps the presently-declared unused compileOnly coordinate resolvable.
architectury_version=13.0.11
