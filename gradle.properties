# Phase 1 of the 26.1.2 -> Minecraft 1.21.11 backport.
# Every version below was resolved against the live artifact repositories on 2026-08-13
# (Fabric meta, Modrinth API, shedaniel/Fuzs/Architectury Maven, CurseForge file IDs).
# See docs/PORT_1_21_11_PHASE1.md for the per-artifact verification table.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
# 1.21.11 is an OBFUSCATED release: Loom must run in remap mode with official Mojang mappings.
minecraft_version=1.21.11
loader_version=0.19.3
fabric_version=0.141.6+1.21.11

# Loom. 1.21.11 requires the remap plugin id (net.fabricmc.fabric-loom-remap);
# the plain net.fabricmc.fabric-loom id is the non-obfuscated (26.1+) plugin.
# 1.17.x needs Gradle >= 9.4; the checked-in wrapper is 9.5.1.
loom_version=1.17.19

# Project
# 版本号 = 上游基线 + 构建元数据
#
# 「1.1.8」是本移植所基于的上游 TACZ 版本（对应 Forge 的 1.1.8-hotfix，
# 默认枪包 gunpack_info.json 里写的也正是 1.1.8）。
# 「+fabric.1.21.11.R1」是 SemVer 的<b>构建元数据</b>(build metadata)。
#
# 为什么用 '+' 而不是 '-'（这是关键，选错会让枪包全部加载失败）：
# Fabric 的 SemanticVersionImpl#compareTo 逐条读过源码后确认——
#   * 比较时先比数字段，再比 prerelease（'-' 后面那段）；
#   * <b>build（'+' 后面那段）从头到尾不参与比较</b>；
#   * prerelease 存在时【小于】同数字段的正式版。
# 于是：
#   1.1.8+fabric.1.21.11.R1 vs 1.1.8  ->  0   即 >=1.1.8 成立
#   1.1.8-fabric.1          vs 1.1.8  -> -1   即 >=1.1.8 不成立
# 枪包 gunpack.meta.json 里的 dependencies 会走 VersionPredicate.parse 与本版本号比对
#（GunPackLoader#modVersionMatch / VersionChecker#modVersionMatch）。
# 若写成 '-fabric...'，凡是要求 ">=1.1.8" 的枪包都会被静默拒绝加载。
mod_version=1.1.8+fabric.1.21.11.R11
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

# Hard dependency
forge_config_api_port=21.11.1

# Optional integration compile dependencies (all verified to have a Fabric 1.21.11 build)
jei_version=27.23.0.71
cloth_config_fabric=21.11.153
modmenu_version=17.0.0
# PAL: 26.1.2 used 1.2.5; the newest 1.21.11 line is 1.1.9 (API delta -> compat/playeranimator/pal/**).
player_animation_lib=1.1.9
# Controllable: the newest Fabric 1.21.11 build is 0.25.7 (26.1.2 used 0.26.0). API delta expected.
controllable_curse_file=7411286
# Shoulder Surfing Reloaded 1.21.11-5.0.10+fabric (Modrinth version id)
shoulder_surfing_version=9T2YSavE
zoomify_version=2.15.2+1.21.11
rei_version=21.11.816
architectury_version=19.0.1

# Optional Iris validation profile: ./gradlew runClient -PwithIris
# Iris 1.10.7+mc1.21.11 (fabric) / Sodium 0.8.13+mc1.21.11 (fabric), pinned by CurseForge file id.
iris_curse_file=7805348
sodium_curse_file=8382544
