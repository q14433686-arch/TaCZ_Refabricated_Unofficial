# Reconstructed from build.gradle and the upstream 26.3 artifact repositories.
# Versions are pinned so that the build is reproducible; see AUDIT_REPORT.md for verification date/source.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.7+26.3

# Project
# 26.3 移植版号：1.2.0 是 gunpack.meta.json 的 dependencies.tacz 实际比较的 SemVer 核心。
# +fabric.26.3.R1 是构建元数据：满足 >=1.2.0，也满足 >=1.1.8，但不满足 =1.1.8 或 <1.2.0。
# 不改成 -fabric…（那会成为预发布版），也不要同步改写上游默认内容包自己的版本号。
# 未来如需 hotfix，序号直接接在 hotfix 后（如 R1-hotfix2），保持 TaCZTweaks 的命名约定。
mod_version=1.2.0+fabric.26.3.R1
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

# Optional integration compile dependencies
# 【26.3 构件可用性核查日期：2026-09-30，逐项实拉 Modrinth / maven.shedaniel.me / maven.architectury.dev】
# REI (26.3.823)、Architectury (22.0.3)、Zoomify (2.16.3+26.3)、Shoulder Surfing Reloaded (26.3-5.2.0+fabric)、
# ModMenu (21.0.0)、Cloth Config (26.3.159) 均已发布 26.3 正式版构件；JEI (31.8.0.48) 与 PAL (1.2.7) 当前为 26.3 beta 通道。
jei_version=31.8.0.48
rei_version=26.3.823
architectury_version=22.0.3
cloth_config_fabric=26.3.159
modmenu_version=21.0.0
player_animation_lib=1.2.7
zoomify_version=2.16.3+26.3
shoulder_surfing_version=26.3-5.2.0+fabric
