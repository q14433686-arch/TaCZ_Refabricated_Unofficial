# Reconstructed from build.gradle and the upstream 26.3 artifact repositories.
# Versions are pinned so that the build is reproducible; see AUDIT_REPORT.md for verification date/source.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.160.7+26.3

# Project
# 版本号 = 上游基线 + 构建元数据
#
# 「1.1.8」是本移植所基于的上游 TACZ 版本（对应 Forge 的 1.1.8-hotfix，
# 默认枪包 gunpack_info.json 里写的也正是 1.1.8）。
# 「+fabric.26.3.R1-hotfix」是 SemVer 的<b>构建元数据</b>(build metadata)。
#
# 为什么用 '+' 而不是 '-'（这是关键，选错会让枪包全部加载失败）：
# Fabric 的 SemanticVersionImpl#compareTo 逐条读过源码后确认——
#   * 比较时先比数字段，再比 prerelease（'-' 后面那段）；
#   * <b>build（'+' 后面那段）从头到尾不参与比较</b>；
#   * prerelease 存在时【小于】同数字段的正式版。
# 于是：
#   1.1.8+fabric.26.3.R1-hotfix vs 1.1.8  ->  0   即 >=1.1.8 成立
#   1.1.8-fabric.1               vs 1.1.8  -> -1   即 >=1.1.8 不成立
# 枪包 gunpack.meta.json 里的 dependencies 会走 VersionPredicate.parse 与本版本号比对
#（GunPackLoader#modVersionMatch / VersionChecker#modVersionMatch）。
# 若写成 '-fabric...'，凡是要求 ">=1.1.8" 的枪包都会被静默拒绝加载。
# 用 '+' 则等价于 1.1.8，既如实声明基线，又不破坏任何枪包的版本约束。
#
# 「R1-hotfix 发布版」的身份只放在 build metadata 与 fabric.mod.json 的 name/description 里；
# 不要写成 1.1.8-R2 这种 prerelease 形式，否则会污染比较语义。
#
# 【hotfix 序号的写法规矩 —— 别改】
# 追加 hotfix 序号时<b>直接接在 hotfix 后面</b>：hotfix2、hotfix3……
# 中间<b>不能</b>放 '.' / '-' / '_' 等任何分隔符（hotfix.2 / hotfix-2 / hotfix_2 都不行）。
# 原因：TaCZTweaks（姊妹模组）按版本号字符串识别本项目，加分隔符会让它认不出来
# ——维护者口径，未在本仓复现其解析代码，故按「不加分隔符」执行。
# 另注意 '-' 在 SemVer 里是 prerelease 分隔符，多写一个 '-' 会把后面的内容
# 拽进 prerelease 段，直接破坏上面那条「>=1.1.8 必须成立」的保证。
mod_version=1.1.8+fabric.26.3.R1-hotfix
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

