# Reconstructed from build.gradle and verified against the 26.1.2 artifact repositories (1.2.0 baseline).
# Versions are pinned so that the build is reproducible; see AUDIT_REPORT.md for verification date/source.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2

# Project
# 版本号 = 上游基线 + 构建元数据
#
# 「1.2.0」是本分支现已对齐的直接上游 TACZ-Refabricated 基线版本
# （默认枪包 gunpack_info.json 同为 1.2.0）。
# 「+fabric.26.1.2.R1」是 SemVer 的<b>构建元数据</b>(build metadata)。
#
# 为什么用 '+' 而不是 '-'（这是关键，选错会让枪包全部加载失败）：
# Fabric 的 SemanticVersionImpl#compareTo 逐条读过源码后确认——
#   * 比较时先比数字段，再比 prerelease（'-' 后面那段）；
#   * <b>build（'+' 后面那段）从头到尾不参与比较</b>；
#   * prerelease 存在时【小于】同数字段的正式版。
# 于是：
#   1.2.0+fabric.26.1.2.R1 vs 1.2.0  ->  0   即 >=1.2.0 与 >=1.1.8 均成立
#   1.2.0-fabric.1         vs 1.2.0  -> -1   即 >=1.2.0 不成立
#
# 【hotfix 序号的写法规矩 —— 别改】
# 追加 hotfix 序号时<b>直接接在 hotfix 后面</b>：hotfix2、hotfix3……
# 中间<b>不能</b>放 '.' / '-' / '_' 等任何分隔符。
mod_version=1.2.0+fabric.26.1.2.R1
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

# Optional integration compile dependencies
jei_version=29.5.0.26
cloth_config_fabric=26.1.154
modmenu_version=18.0.0-alpha.8
player_animation_lib=1.2.5
controllable_version=0.26.0+26.1.2
framework_version=0.13.23+26.1.2
shoulder_surfing_version=kpNYppvf
zoomify_version=2.16.0+26.1
rei_version=26.1.819
architectury_version=20.0.12

# Optional Iris validation profile: ./gradlew runClient -PwithIris
