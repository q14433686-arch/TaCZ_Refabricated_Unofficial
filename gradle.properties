# Reconstructed from build.gradle and verified against the 26.1.2 artifact repositories.
# Versions are pinned so that the build is reproducible; see AUDIT_REPORT.md for verification date/source.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

# Minecraft / Fabric
minecraft_version=26.1.2
loader_version=0.19.3
fabric_version=0.155.2+26.1.2

# Project
# 版本号 = 上游基线 + 构建元数据
#
# 「1.1.8」是本移植所基于的上游 TACZ 版本（对应 Forge 的 1.1.8-hotfix，
# 默认枪包 gunpack_info.json 里写的也正是 1.1.8）。
# 「+fabric.26.1.2.Beta-1」是 SemVer 的<b>构建元数据</b>(build metadata)。
#
# 为什么用 '+' 而不是 '-'（这是关键，选错会让枪包全部加载失败）：
# Fabric 的 SemanticVersionImpl#compareTo 逐条读过源码后确认——
#   * 比较时先比数字段，再比 prerelease（'-' 后面那段）；
#   * <b>build（'+' 后面那段）从头到尾不参与比较</b>；
#   * prerelease 存在时【小于】同数字段的正式版。
# 于是：
#   1.1.8+fabric.26.1.2.Beta-1  vs 1.1.8  ->  0   即 >=1.1.8 成立
#   1.1.8-fabric.1        vs 1.1.8  -> -1   即 >=1.1.8 不成立
# 枪包 gunpack.meta.json 里的 dependencies 会走 VersionPredicate.parse 与本版本号比对
#（GunPackLoader#modVersionMatch / VersionChecker#modVersionMatch）。
# 若写成 '-fabric...'，凡是要求 ">=1.1.8" 的枪包都会被静默拒绝加载。
# 用 '+' 则等价于 1.1.8，既如实声明基线，又不破坏任何枪包的版本约束。
#
# 「Beta-1 测试版」的身份只放在 build metadata 与 fabric.mod.json 的 name/description 里；
# 不要写成 1.1.8-Beta-1 这种 prerelease 形式，否则会污染比较语义。
mod_version=1.1.8+fabric.26.1.2.Beta-1
maven_group=cn.sh1rocu
archives_base_name=TACZ-Refabricated

# Optional integration compile dependencies
jei_version=29.5.0.26
cloth_config_fabric=26.1.154
modmenu_version=18.0.0-alpha.8
player_animation_lib=1.2.5
zoomify_version=2.16.0+26.1
rei_version=26.1.819
architectury_version=20.0.12

# Optional Iris validation profile: ./gradlew runClient -PwithIris
