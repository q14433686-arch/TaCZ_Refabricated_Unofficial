pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Fabric Snapshots'
            url = 'https://maven.fabricmc.net/snapshots/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'TACZ-Refabricated'

// ============================================================================
// TACZ-INDUSTRIAL CI 探针：settings 配置阶段（最早可执行点）
// ----------------------------------------------------------------------------
// 用途：在 GitHub Actions 上标记"Gradle 已走到 settings 配置"，并把探针记录
// 推回分支（git add -f + 显式 refspec，绕开 .gitignore 与 detached HEAD 两个
// 实测踩过的坑）。与 build.gradle 尾部探针、taczindCiRelay 任务互为参照系：
//   settings 探针落地 + build 探针缺失 → 配置死在 build.gradle
//   两者都落地 + relay 缺失            → 任务图未执行/relay 自身问题
//   三个全灭                           → git 推送通道本身死（权限/网络）
// 本地构建（无 GITHUB_ACTIONS）完全零影响。
// ============================================================================
if (System.getenv("GITHUB_ACTIONS") == "true") {
    try {
        def probeDir = new File(settingsDir, "build-reports")
        probeDir.mkdirs()
        def branch = System.getenv("GITHUB_REF_NAME") ?: ""
        new File(probeDir, "ci-probe-settings.txt").text =
            "settings-probe ok @ ${new Date()}\nbranch=${branch}\nsha=${System.getenv('GITHUB_SHA')}\n"
        def git = { List<String> args ->
            def p = (["git"] + args).execute(null, settingsDir)
            def out = p.inputStream.text
            def err = p.errorStream.text
            p.waitFor()
            println "[taczind-ci:settings] git ${args.join(' ')} -> ${p.exitValue()} ${err?.trim()?.take(300) ?: ''}"
            return p.exitValue()
        }
        if (branch) {
            git(["config", "user.name", "taczind-ci-probe[bot]"])
            git(["config", "user.email", "taczind-ci-probe@users.noreply.github.com"])
            git(["add", "-f", "-A", "build-reports"])
            git(["commit", "-m", "ci-probe: settings/config ok"])
            3.times {
                git(["fetch", "origin", branch])
                git(["rebase", "FETCH_HEAD"])
                if (git(["push", "origin", "HEAD:refs/heads/${branch}"]) == 0) return
            }
        }
    } catch (Throwable t) {
        println "[taczind-ci:settings] probe 异常（不影响构建）: ${t}"
    }
    // ========================================================================
    // 静默潜伏推送哨兵（detached watcher）：
    // gradle 配置阶段一旦失败，后续任务/探针/relay 全都不会执行；
    // 但错误全文已由 workflow 的 shell 重定向持续写入 build-reports/compile-java.log。
    // 此处在 settings 阶段（全仓库首个必然执行点）后台派生一个哨兵循环：
    // 每 20s 检查一次 build-reports 变更并推送（最多 10 分钟），
    // 无论本次构建死在哪个阶段，最终日志都能回到分支。
    // ========================================================================
    try {
        def watcher = '''for i in $(seq 1 30); do
  sleep 20
  cd "REPO_ROOT_PLACEHOLDER" || exit 0
  git add -f -A build-reports >/dev/null 2>&1
  if ! git diff --cached --quiet >/dev/null 2>&1; then
    git commit -m "ci-watch: log snapshot $i" >/dev/null 2>&1
    git fetch origin "$GITHUB_REF_NAME" >/dev/null 2>&1
    git rebase --abort >/dev/null 2>&1
    git rebase FETCH_HEAD >/dev/null 2>&1
    git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" >/dev/null 2>&1
  fi
done
'''
        watcher = watcher.replace("REPO_ROOT_PLACEHOLDER", settingsDir.absolutePath)
        // 哨兵脚本只含双引号、无单引号，直接单引号包裹传递（bash 单引号内换行合法）。
        // 不用 String.inspect()：它把换行转为字面 \n，bash 单引号不解释，脚本会断。
        def innerNoSingleQuotes = !watcher.contains("'")
        if (innerNoSingleQuotes) {
            ["bash", "-c", "nohup bash -c '" + watcher + "' >/dev/null 2>&1 < /dev/null &"].execute(null, settingsDir)
        }
        println "[taczind-ci:settings] 潜伏推送哨兵已派生"
    } catch (Throwable t) {
        println "[taczind-ci:settings] 哨兵派生失败（不影响构建）: ${t}"
    }
}
