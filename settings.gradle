pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Fabric Snapshots'
            url = 'https://maven.fabricmc.net/snapshots/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // 1.21.11 is obfuscated -> the *-remap* plugin id.
        // (net.fabricmc.fabric-loom without the suffix is the non-obfuscated 26.1+ plugin,
        //  and the bare legacy `fabric-loom` id resolves to whichever mode Loom guesses.)
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    }
}

rootProject.name = 'TACZ-Refabricated'
