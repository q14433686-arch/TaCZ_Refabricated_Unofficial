// poly_mesh / render-timing bytecode probes (refab 1.21.11 branch).
//
// WHY THIS IS A FILE AND NOT A build.gradle BLOCK: the agent sandbox for this repo has no JDK,
// no loom cache and no Minecraft/Iris jars, so every vanilla + Iris member a render feature calls
// can only be read from the real compile classpath - inside CI, with javap, and the output
// committed back to the branch by the compile-check workflow (build-reports/compile-java.log),
// which a sandboxed agent can then read with `gh api .../contents/build-reports/compile-java.log`.
// Until 2026-08-31 these two probes were TEMP blocks inside build.gradle wired with
// compileJava.finalizedBy. That cost: (a) they ran on every CI build, (b) every round had to
// remember to delete them before release, (c) other branches/agents could not reuse them.
// Now: same code, opt-in, and reusable by any branch (only the class + member name lists need
// updating for a different Minecraft version - which is exactly the question a cross-era port
// has to answer first; see docs/TML_GPU_PROBE_TOOL_20260831.md).
//
// USAGE
//   ./gradlew -PmeshProbe dumpHandFlushApi                 # one probe, stdout only
//   ./gradlew -PmeshProbe dumpWorldFlushProbe              # the world/flush probe
//   ./gradlew -PmeshProbe -PmeshProbeEveryBuild compileJava # output lands in
//                                                          # build-reports/compile-java.log (CI channel)
// -PmeshProbe is what registers the tasks at all (build.gradle applies this file under that
// property); -PmeshProbeEveryBuild is what attaches them to compileJava. Neither is set by CI,
// so a normal build never pays for this.
//
// Both task bodies stay wrapped in try/catch: a diagnostic must never fail a build - an
// unguarded finalizedBy failure would turn a missing class into a red compile.

// TEMP (step 2 v2, "draw inside the hand flush" route): the sandbox has no JDK, no loom cache and
// no Minecraft/Iris jars, so every vanilla + Iris member this feature calls can only be read from
// the real compile classpath inside CI. This task javap-dumps exactly those members; its stdout
// lands in build-reports/compile-java.log, which the compile-check workflow commits back to the
// branch. Remove before release.
tasks.register('dumpHandFlushApi') {
    doLast {
        // Diagnostics must never break the build: a finalizedBy failure would fail compileJava.
        try {
            def cp = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
            def javapExe = 'javap'
            for (String home : [System.getProperty('java.home'), System.getenv('JAVA_HOME')]) {
                if (!home) {
                    continue
                }
                def candidate = new File(new File(home), 'bin/javap')
                if (candidate.exists()) {
                    javapExe = candidate.absolutePath
                    break
                }
            }

            def runJavap = { String cls, List flags ->
                def cmd = [javapExe, '-classpath', cp] + flags + [cls]
                def proc = new ProcessBuilder(cmd).redirectErrorStream(false).start()
                def out = proc.inputStream.getText('UTF-8')
                def err = proc.errorStream.getText('UTF-8')
                proc.waitFor()
                return [out, err]
            }

            // javap's own declaration line for every member whose signature contains one of the needles.
            def dumpMembers = { String cls, List needles ->
                // needles == [] -> print the whole member list (for enum constants etc.)
                def (out, err) = runJavap(cls, ['-p'])
                println "===== javap -p ${cls} (filtered: ${needles.join(', ')}) ====="
                if (!out?.trim()) {
                    println "(no output) ${(err ?: '').trim()}"
                    return
                }
                def hits = 0
                out.readLines().each { line ->
                    if (!line.trim()) {
                        return
                    }
                    if (needles.isEmpty() || needles.any { n -> line.contains(n) }) {
                        println '  ' + line.trim()
                        hits++
                    }
                }
                if (hits == 0) {
                    println '  (no member matched)'
                }
            }

            // Full bytecode of every overload of one method: what matters here is the *order* of the
            // calls inside it, plus how many plain `return` instructions exist (@At("RETURN") hooks
            // all of them, @At("TAIL") only the last one).
            def dumpMethod = { String cls, String name ->
                def (out, err) = runJavap(cls, ['-c', '-p'])
                println "===== javap -c -p ${cls}#${name} ====="
                if (!out?.trim()) {
                    println "(no output) ${(err ?: '').trim()}"
                    return
                }
                def cur = null
                def blocks = []
                out.readLines().each { line ->
                    // a member signature line: exactly two leading spaces, ends with ');'
                    if (line ==~ /^  [^ ].*\);\s*$/) {
                        if (cur != null) {
                            blocks << cur
                        }
                        cur = [line]
                    } else if (cur != null) {
                        cur << line
                    }
                }
                if (cur != null) {
                    blocks << cur
                }
                def found = blocks.findAll { it[0].contains(' ' + name + '(') }
                if (found.isEmpty()) {
                    println "  NOT FOUND among ${blocks.size()} members"
                    return
                }
                found.each { b ->
                    def returns = b.count { it =~ /:\s+return\s*$/ }
                    def flush = b.findIndexOf { it.contains('renderAllFeatures') }
                    def batch = b.findIndexOf { it.contains('endBatch') }
                    println "  --- ${b[0].trim()}  (${b.size()} lines, ${returns} x 'return'," +
                            " renderAllFeatures at line ${flush}, endBatch at line ${batch}) ---"
                    println b.join('\n')
                }
            }

            // 1. The premise of the new draw point: renderHandsWithItems must itself end with
            //    renderAllFeatures() + BufferSource#endBatch(), and RETURN has to cover every path.
            dumpMethod('net.minecraft.client.renderer.ItemInHandRenderer', 'renderHandsWithItems')

            // 2. blaze3d surface the mesh pass calls directly (target selection + scissor + uniforms).
            dumpMethod('net.minecraft.client.renderer.rendertype.RenderType', 'draw')
            dumpMethod('net.minecraft.client.renderer.MultiBufferSource$BufferSource', 'endBatch')
            dumpMembers('com.mojang.blaze3d.systems.RenderPass',
                    ['enableScissor', 'setUniform', 'setVertexBuffer', 'setIndexBuffer', 'drawIndexed',
                     'setPipeline', 'bindTexture', 'close'])
            dumpMembers('com.mojang.blaze3d.systems.ScissorState',
                    ['enabled', 'public int x()', 'public int y()', 'width()', 'height()'])
            dumpMembers('com.mojang.blaze3d.pipeline.RenderTarget', ['useDepth', 'getColorTextureView', 'getDepthTextureView'])
            dumpMembers('com.mojang.blaze3d.systems.RenderSystem',
                    ['outputColorTextureOverride', 'outputDepthTextureOverride', 'getScissorStateForRenderTypeDraws',
                     'bindDefaultUniforms', 'getSequentialBuffer', 'getDynamicUniforms', 'getModelViewMatrix', 'getDevice'])

            // 3. Can a BufferBuilder write an arbitrary (Iris-extended) format, i.e. does
            //    addVertex() fill in the components the mesh does not supply?
            dumpMembers('com.mojang.blaze3d.vertex.BufferBuilder', ['BufferBuilder(', 'addVertex', 'putBulkData', 'defaults'])
            dumpMembers('com.mojang.blaze3d.vertex.VertexFormat',
                    ['Defaults', 'getVertexFormatElements', 'getVertexSize', 'getIndexType', 'elements'])
            dumpMembers('com.mojang.blaze3d.vertex.DefaultVertexFormat', ['NEW_ENTITY'])

            // 4. The Iris side: hand flush entry points, program assignment, extended formats.
            dumpMembers('net.irisshaders.iris.pathways.HandRenderer',
                    ['endRender', 'renderSolid', 'renderTranslucent', 'isActive', 'isRenderingSolid', 'setupGlState'])
            dumpMembers('net.irisshaders.iris.api.v0.IrisApi', ['assignPipeline', 'getMinorApiRevision', 'isShaderPackInUse'])
            // Full constant list (empty needle list = no filter): the world GPU path needs the
            // program constant for level entities, and guessing it is exactly what this task exists
            // to avoid.
            dumpMembers('net.irisshaders.iris.api.v0.IrisProgram', [])
            dumpMembers('net.minecraft.client.renderer.feature.FeatureRenderDispatcher',
                    ['public', 'protected'])
            dumpMembers('net.irisshaders.iris.vertices.IrisVertexFormats', ['ENTITY', 'TERRAIN', 'HAND'])
            dumpMembers('net.irisshaders.iris.pipeline.programs.ShaderKey', ['HAND_CUTOUT', 'HAND_TRANSLUCENT'])
            dumpMembers('net.irisshaders.iris.pipeline.IrisPipelines', ['assignPipeline', 'getPipeline'])
            dumpMembers('net.irisshaders.iris.vertices.ImmediateState',
                    ['renderWithExtendedVertexFormat', 'isRenderingLevel', 'safeToMultiply', 'skipExtension'])
        } catch (Throwable t) {
            println "> dumpHandFlushApi failed (harmless, diagnostics only): ${t}"
        }
    }
}

// TEMP (world-context GPU baking probe): same channel as dumpHandFlushApi -- the sandbox has no JDK,
// so the only way to read the real 1.21.11 renderer is to javap it inside CI and have the
// compile-check workflow push the log back. This one answers the three questions the world table
// hinges on: (1) where does LevelRenderer actually flush the collector geometry it collected,
// (2) what is RenderSystem's model-view stack at that moment (is it still the view rotation the
// batches were drawn with, or already restored), (3) does anything else override the render target
// around there. Remove once the fix lands.
tasks.register('dumpWorldFlushProbe') {
    doLast {
        // Diagnostics must never break the build: a finalizedBy failure would fail compileJava.
        try {
            def cp = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
            def javapExe = 'javap'
            for (String home : [System.getProperty('java.home'), System.getenv('JAVA_HOME')]) {
                if (!home) {
                    continue
                }
                def candidate = new File(new File(home), 'bin/javap')
                if (candidate.exists()) {
                    javapExe = candidate.absolutePath
                    break
                }
            }

            // Walk `javap -c -p <class>` and report only the instructions that mention one of the
            // needles, tagged with the enclosing method and a few lines of context. That keeps the
            // log small while still proving *ordering* (which call comes first) -- ordering is the
            // whole question here, so a filtered member list would not be enough.
            def probe = { String cls, List needles, int context ->
                def cmd = [javapExe, '-classpath', cp, '-c', '-p', cls]
                def proc = new ProcessBuilder(cmd).redirectErrorStream(false).start()
                def out = proc.inputStream.getText('UTF-8')
                def err = proc.errorStream.getText('UTF-8')
                proc.waitFor()
                println "===== [W-PROBE] ${cls} (needles: ${needles.join(', ')}) ====="
                if (!out?.trim()) {
                    println "  (no output) ${(err ?: '').trim()}"
                    return
                }
                def lines = out.readLines()
                def current = '<class>'
                def hits = 0
                lines.eachWithIndex { line, idx ->
                    if (line ==~ /^  [^ ].*\);\s*$/) {
                        current = line.trim()
                        return
                    }
                    if (needles.any { n -> line.contains(n) }) {
                        hits++
                        int from = Math.max(0, idx - context)
                        int to = Math.min(lines.size() - 1, idx + context)
                        println "  --- in ${current} @${idx} ---"
                        (from..to).each { j -> println '    ' + lines[j] }
                    }
                }
                if (hits == 0) {
                    println "  (no instruction matched)"
                }
            }

            // 1. Where is the world's feature/collector flush, relative to the entity translucent
            //    endBatch calls, the shadow pass and the method's own return?
            probe('net.minecraft.client.renderer.LevelRenderer',
                    ['renderAllFeatures', 'endBatch', 'getModelViewStack', 'setupRender',
                     'outputColorTextureOverride', 'outputDepthTextureOverride'], 4)

            // 2. Who owns the model-view stack around the level render (this decides whether a
            //    pass opened at the world flush still gets the same ModelViewMat the batches used).
            probe('net.minecraft.client.renderer.GameRenderer',
                    ['getModelViewStack', 'setModelViewMatrix', 'renderLevel', 'viewRotation',
                     'popMatrix', 'pushMatrix', 'lastRenderProjectionMatrix'], 3)

            // 3. The dispatch side: entity poses are camera-relative, so the flush-time MV must be
            //    rotation-only. Verify what EntityRenderDispatcher actually multiplies.
            probe('net.minecraft.client.renderer.entity.EntityRenderDispatcher',
                    ['subtract', 'translate', 'getModelViewStack', 'position'], 3)

            // 4. FeatureRenderDispatcher: the full method list (small) + which phases exist.
            probe('net.minecraft.client.renderer.feature.FeatureRenderDispatcher',
                    ['renderAllFeatures', 'executeSolid', 'execute', 'prepareFrame', 'clear'], 2)
        } catch (Throwable t) {
            println "> dumpWorldFlushProbe failed (harmless, diagnostics only): ${t}"
        }
    }
}


// Attached at the END on purpose: the two tasks are registered above, and the string form keeps
// resolution lazy (Gradle resolves finalizedBy names when the task graph is built). Neither
// property is set by CI, so a normal build never parses or runs any of this.
if (project.hasProperty('meshProbeEveryBuild')) {
    compileJava.finalizedBy 'dumpHandFlushApi'
    compileJava.finalizedBy 'dumpWorldFlushProbe'
}
