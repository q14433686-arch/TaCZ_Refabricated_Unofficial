// The isolated smoke jobs have cold Gradle caches. Fabric's Maven can serve the ASM
// module POMs without their org.ow2 parent; if Central throttles the runner, even
// Loom configuration fails before a game starts. Read those same Central coordinates
// from Google's Central mirror first. No substitutions, artifact-only metadata or
// credentials; keep every other module on the project's normal repositories.
def addAsmMirror = { repos ->
    repos.maven {
        name = 'SmokeCentralAsm'
        url = URI.create('https://maven-central.storage-download.googleapis.com/maven2/')
        content {
            includeGroup 'org.ow2.asm'
            includeModule 'org.ow2', 'ow2'
        }
    }
}

gradle.beforeSettings { settings -> addAsmMirror(settings.pluginManagement.repositories) }
gradle.beforeProject { project -> addAsmMirror(project.repositories) }
