import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tacz_port_test'
        enableGameTests = true
        enableClientGameTests = project.hasProperty('taczClientSmoke')
    }
    configureDataGeneration {
        client = true
    }
}

loom {
    mods { tacz { sourceSet sourceSets.main } }
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")
    // From Loom 1.17: mixin AP is no longer enabled by default.
    // The legacy mixin AP requires mappings, which don't exist in 26.1+.
    // Runtime Mixin handles @Mixin/@Inject/@Accessor/@Invoker directly on unobfuscated bytecode.

    runs {
        client {
            // The embedded default pack alone contains >80 MiB of textures, audio, and models.
            // 384 MiB consistently OOMs during its first resource reload under 26.1.2.
            vmArg "-Xmx768m"
        }
        server {
            vmArg "-Xmx384m"
        }
        datagen {
            vmArg "-Xmx384m"
        }
    }
}

repositories {
    // Pin Zigy's 26.1 release (PlayerAnimationLibMerged-1.2.5+mc.26.1.jar under tag v1.2.5+26.1),
    // which is the official PAL 1.2.5 build for Minecraft 26.1.x (including 26.1.2).
    exclusiveContent {
        forRepository {
            ivy {
                url = uri('https://github.com/ZigyTheBird/PlayerAnimationLibrary/releases/download')
                patternLayout { artifact("v[revision]/[artifact]-${player_animation_lib}+mc.26.1.[ext]") }
                metadataSources { artifact() }
            }
        }
        filter { includeModule('zigy.release', 'PlayerAnimationLibMerged') }
    }
    // Official signed Fabric releases; neither Controllable nor Framework is bundled into TaCZ.
    ['Controllable', 'Framework'].each { mod ->
        exclusiveContent {
            forRepository {
                ivy {
                    name = "MrCrayfish${mod}Releases"
                    url = uri("https://github.com/MrCrayfish/${mod}/releases/download")
                    patternLayout { artifact('v[revision]/[artifact]-[revision]-signed.[ext]') }
                    metadataSources { artifact() }
                }
            }
            filter { includeModule('mrcrayfish.release', mod.toLowerCase(Locale.ROOT) + '-fabric') }
        }
    }
    // Only for compiling the SDL2 virtual-device test. Controllable itself supplies it at runtime.
    exclusiveContent {
        forRepository {
            ivy {
                url = uri('https://github.com/MrCrayfish/ControllableSDL/releases/download')
                patternLayout { artifact('v[revision]/[artifact]-[revision].[ext]') }
                metadataSources { artifact() }
            }
        }
        filter { includeModule('mrcrayfish.test', 'controllable-sdl') }
    }
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
    }
    maven {
        name = "MaydayMemory's Repo"
        url = uri("https://colored-glaze.github.io")
        content {
            includeGroup "com.maydaymemory"
        }
    }
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Forge Config API Port"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "ModMenu"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // Fallback for JEI
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "KosmX's maven"
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        url = "https://maven.saps.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        name = "isXander maven"
        url = "https://maven.isxander.dev/releases"
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Opt-in compatibility run. Iris 1.11.2 + Sodium 0.9.1 are the current 26.1.2 pair.
    if (project.hasProperty("withIris")) {
        runtimeOnly "curse.maven:irisshaders-455508:${project.iris_curse_file}"
        runtimeOnly "curse.maven:sodium-394468:${project.sodium_curse_file}"
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    // MAE (Math Expression Evaluator / animation pose API)
    implementation(include("com.maydaymemory:mae:1.1.1")) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }

    implementation(include("org.apache.commons:commons-math3:3.6.1"))
    implementation(include("com.github.FiguraMC.luaj:luaj-core:3.0.8-figura"))
    implementation(include("com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura")) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include("org.apache.bcel:bcel:6.6.1")) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // JEI — verified 26.1.2 Fabric release
    compileOnly "maven.modrinth:jei:${jei_version}"

    // Cloth Config — 26.1.x
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}"

    // Player Animation Lib — PAL 1.2.5+mc.26.1
    compileOnly "zigy.release:PlayerAnimationLibMerged:${player_animation_lib}+26.1"

    // Controllable 0.26.0+26.1.2 & SDL2 test headers
    compileOnly "mrcrayfish.release:controllable-fabric:${controllable_version}"
    gametestCompileOnly 'mrcrayfish.test:controllable-sdl:2.32.10-1.1.0'

    // Forge Config API Port - 26.1.5 Fabric
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"

    // ModMenu — 18.0.0-alpha.8 (26.1–26.1.2)
    implementation "maven.modrinth:modmenu:${modmenu_version}"

    // Zoomify — 2.16.0+26.1
    compileOnly "maven.modrinth:zoomify:${zoomify_version}"

    // Shoulder Surfing Reloaded — 26.1.2 (plugin API 5.x, optional at runtime)
    compileOnly("maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}") {
        transitive = false
    }

    // REI — 26.1.2 (indexed per-display removal via full RoughlyEnoughItems-fabric jar)
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}") { transitive = false }
}

// An installed JEI or REI is tested in its own client. No viewer in the baseline runtime or nested JAR.
configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
if (project.hasProperty('taczPalSmoke')) {
    loom.runs.clientGameTest.property 'tacz.test.pal', 'true'
    dependencies { gametestRuntimeOnly "zigy.release:PlayerAnimationLibMerged:${player_animation_lib}+26.1" }
    tasks.named('runClientGameTest') {
        doFirst {
            def pal = configurations.gametestRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group == 'zigy.release' }
            def digest = MessageDigest.getInstance('SHA-256').digest(pal.file.bytes).encodeHex().toString()
            if (digest != '42118eb455e63cef0e8622716b07810a5fb9f5a82c8df3027ec0c2951bc6a11a')
                throw new GradleException("Wrong target PAL binary: $digest")
            logger.lifecycle("Target PAL file: ${pal.file.name} SHA-256 $digest")
        }
    }
}
if (project.hasProperty('taczControllerSmoke')) {
    loom.runs.clientGameTest.property 'tacz.test.controller', 'true'
    dependencies {
        gametestRuntimeOnly "mrcrayfish.release:controllable-fabric:${controllable_version}"
        gametestRuntimeOnly "mrcrayfish.release:framework-fabric:${framework_version}"
    }
}
if (project.hasProperty('taczViewerSmoke')) {
    if (!project.hasProperty('taczClientSmoke')) throw new GradleException('Viewer smoke needs a client')
    def viewer = project.property('taczViewerSmoke')
    loom.runs.clientGameTest.property 'tacz.test.viewer', viewer
    dependencies {
        if (viewer == 'jei') gametestRuntimeOnly "maven.modrinth:jei:${jei_version}"
        else if (viewer == 'rei') {
            gametestRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}") { transitive = false }
            gametestRuntimeOnly("dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }
        } else throw new GradleException("Unknown viewer: $viewer")
    }
}

if (project.hasProperty('taczClientSuite')) {
    loom.runs.clientGameTest.property 'tacz.test.suite', project.property('taczClientSuite')
}
if (project.hasProperty('taczIrisSmoke')) {
    dependencies { gametestRuntimeOnly files('build/iris-smoke/iris.jar', 'build/iris-smoke/sodium.jar') }
    loom.runs.clientGameTest.property 'tacz.test.iris', 'true'
    if (project.hasProperty('taczIrisColor')) loom.runs.clientGameTest.property 'tacz.test.irisColor', project.property('taczIrisColor')
    if (project.hasProperty('taczOpticSuite')) loom.runs.clientGameTest.property 'tacz.test.optics', project.property('taczOpticSuite')
    def installPack = tasks.register('installTestShaderPack', Copy) {
        dependsOn tasks.named('deleteGameTestRunDir')
        into layout.buildDirectory.dir('run/clientGameTest')
        if (project.hasProperty('taczIrisColor') || project.hasProperty('taczOpticSuite')) from 'build/iris-smoke/complementary'
        else from 'src/gametest/irisConfig'
    }
    tasks.named('runClientGameTest') { dependsOn installPack }
}

// External game-test pack, never a production classpath resource.
['gameTest', 'clientGameTest'].each { run ->
    if (run == 'clientGameTest' && !project.hasProperty('taczClientSmoke')) return
    def zip = tasks.register("zip${run.capitalize()}Pack", Zip) {
        from 'src/gametest/fixtures/overlay'
        from('tools/player-acceptance-pack') { exclude 'gunpack.meta.json', 'README.md' }
        archiveFileName = 'tacz-port-smoke.zip'
        destinationDirectory = layout.buildDirectory.dir("run/${run}/tacz")
        if (run == 'clientGameTest') dependsOn tasks.named('deleteGameTestRunDir')
    }
    tasks.named("run${run.capitalize()}") { dependsOn zip }
}

test { useJUnitPlatform() }

// Compressed immutable fallback resource archive for unchanged 1.1.8 assets; explicit
// src/main/resources files override modified 1.2.0 entries via DuplicatesStrategy.EXCLUDE,
// and the 8 upstream 1.1.8 files retired in 1.2.0 are excluded explicitly.
def bundledSourcesAndResources = file("resources/tacz-26.1.2-source-and-resource-bundle.jar")

processResources {
    inputs.property "version", project.version
    inputs.file bundledSourcesAndResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(zipTree(bundledSourcesAndResources)) {
        exclude "META-INF/**"
        exclude "**/*.java"
        exclude "fabric.mod.json"
        exclude "*.mixins.json"
        exclude "tacz.accesswidener"
        exclude "shouldersurfing_plugin.json"
        exclude "assets/tacz/custom/tacz_default_gun/assets/tacz/tacz_sounds/rpk/rpk_inspect.ogg"
        exclude "assets/tacz/custom/tacz_default_gun/assets/tacz/tacz_sounds/rpk/rpk_reload_empty.ogg"
        exclude "assets/tacz/custom/tacz_default_gun/assets/tacz/tacz_sounds/rpk/rpk_reload_tactical.ogg"
        exclude "assets/tacz/custom/tacz_default_gun/assets/tacz/textures/attachment/uv/grip_magpul_afg_2_n.png"
        exclude "assets/tacz/custom/tacz_default_gun/assets/tacz/textures/attachment/uv/sight_sro_dot_n.png"
        exclude "assets/tacz/custom/tacz_default_gun/data/tacz/recipe/attachments/oem_stock_heavy.json"
        exclude "assets/tacz/custom/tacz_default_gun/data/tacz/recipe/attachments/oem_stock_light.json"
        exclude "assets/tacz/custom/tacz_default_gun/data/tacz/recipe/attachments/oem_stock_tactical.json"
    }
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

def meshPassTestClasses = layout.buildDirectory.dir("classes/meshRenderPassTest")
tasks.register("compileMeshRenderPassTest", JavaCompile) {
    source files(
            "src/main/java/cn/sh1rocu/tacz/compat/meshloader/render/MeshRenderPassBatches.java",
            "tests/mesh-render-pass/MeshRenderPassBatchesTest.java")
    classpath = files()
    destinationDirectory = meshPassTestClasses
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}
tasks.register("meshRenderPassTest", JavaExec) {
    dependsOn "compileMeshRenderPassTest"
    classpath = files(meshPassTestClasses)
    mainClass = "cn.sh1rocu.tacz.compat.meshloader.render.MeshRenderPassBatchesTest"
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}
tasks.named("check") {
    dependsOn "meshRenderPassTest"
}

sourceSets {
    main {
        java {
            exclude 'com/tacz/guns/compat/ar/ARCompatImpl.java'
            exclude 'com/tacz/guns/compat/ar/AcceleratedBeamRenderer.java'
            exclude 'com/tacz/guns/compat/kubejs/**'
            exclude 'com/tacz/guns/compat/playeranimator/animation/**'
            exclude 'com/tacz/guns/compat/playeranimator/PlayerAnimatorAssetManager.java'
            exclude 'com/tacz/guns/compat/optifine/**'
            exclude 'com/tacz/guns/mixin/client/ar/**'
        }
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSES") { into "META-INF/licenses" }
    from("LICENSES.md") { into "META-INF/licenses" }
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
