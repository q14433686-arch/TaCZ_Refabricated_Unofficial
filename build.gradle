plugins {
    // 1.21.11 is an obfuscated Minecraft release, so Loom must run in remap mode.
    // Version comes from gradle.properties (loom_version) via settings.gradle's plugins block.
    id 'net.fabricmc.fabric-loom-remap'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")
    // 1.21.11 is obfuscated, so mappings exist again and the legacy mixin AP is both
    // available and REQUIRED: mixin targets written in official Mojang names have to be
    // translated into intermediary at runtime through a refmap.
    // (Under 26.1.2 this block was commented out because non-obfuscated Minecraft has no mappings.)
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "tacz.refmap.json"
    }
    runs {
        client {
            // The embedded default pack alone contains >80 MiB of textures, audio, and models.
            // 384 MiB consistently OOMs during its first resource reload.
            vmArg "-Xmx768m"
            // Step 2 lens diagnostic. Enable with: gradlew runClient -PtaczScopeDebug=true
            // (The TACZ client config file does NOT contain this switch; it is a JVM property.)
            vmArg "-Dtacz.scope.pip.debug.paint=${providers.gradleProperty('taczScopeDebug').getOrElse('false')}"
            // Step 3 real scope PIP. Enable with: gradlew runClient -PtaczScopePip=true
            // (JVM property, not a config-file option; same reason as Step 2.)
            vmArg "-Dtacz.scope.pip.enable=${providers.gradleProperty('taczScopePip').getOrElse('false')}"
        }
        server {
            vmArg "-Xmx384m"
        }
        datagen {
            property "fabric-api.datagen.modid", "tacz"
        }
    }
}

repositories {
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.shedaniel.me/" } // cloth config api
    maven { url "https://dvs1.progwml6.com/files/maven/" }
    maven { url "https://modmaven.dev" }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "devOSSnapshots"
        url = uri("https://mvn.devos.one/snapshots")
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // ================================================================
    // 1.21.11 是混淆版本，Loom 回到 remap 模式：
    //   * 必须声明 mappings（官方 Mojang 映射）
    //   * mod 依赖必须走 mod* 配置，否则不会被 remap，运行期一定 NoClassDefFound
    //   * 普通 Java 库继续用 implementation(include(...))
    // ================================================================

    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Iris 1.10.7 + Sodium 0.8.13 are the current 1.21.11 Fabric pair.
    //
    // Iris is now modCompileOnly (was runtimeOnly behind -PwithIris). Reason: the scope's
    // Iris integration lives in mixin/client/iris/**, which @Mixin(targets = "...ShaderCreator").
    // With Iris invisible at compile time the mixin AP reports "target could not be found",
    // so the whole package had to be excluded -- and with it the hand-shader patching that
    // makes water/clouds/fog/particles visible inside the ocular under shaders.
    //
    // compileOnly keeps Iris OUT of the distributable and off the normal run classpath; the
    // mixin is additionally gated at runtime by IrisCompatMixinPlugin (isModLoaded("iris"))
    // and tacz.iris.mixins.json stays required=false, so a user without Iris is unaffected.
    modCompileOnly "curse.maven:irisshaders-455508:${project.iris_curse_file}"
    if (project.hasProperty("withIris")) {
        modRuntimeOnly "curse.maven:irisshaders-455508:${project.iris_curse_file}"
        modRuntimeOnly "curse.maven:sodium-394468:${project.sodium_curse_file}"
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    // NOTE: with loom.mixin.useLegacyMixinAp = true, Loom wires the Sponge mixin
    // annotation processor and the mapping file for it by itself. Do not add a manual
    // annotationProcessor entry for mixin/mappings here or the refmap is generated twice.

    // ============================================================
    // 26.1.2 dependency audit. Optional integrations stay compile-only so they are
    // absent from the distributable and are guarded by FabricLoader at runtime.
    // ============================================================

    // simplebedrockmodel — the old library has no 26.1.2 build; the small API surface TACZ
    // consumes is provided by local compatibility interfaces and the collector-backed renderer.

    // MAE (Math Expression Evaluator)
    implementation(include("com.maydaymemory:mae:1.1.1")) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    // Apache Commons Math
    implementation(include('org.apache.commons:commons-math3:3.6.1'))

    // LuaJ
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // ============================================================
    // 以下为运行时/编译时 mod 依赖；无 26.1.2 构建的项保持注释
    // ============================================================

    // JEI — verified 26.1.2 Fabric release (kept on the previously compiled API line)
    modCompileOnly "maven.modrinth:jei:${jei_version}"

    // Cloth Config — 26.1.x
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}"

    // Embeddium
    // compileOnly "curse.maven:embeddium-908741:${embeddedt_id}"

    // Carry On 2.10.0 supports 26.1.2. Its modern compatibility contract is the
    // carryon:block_blacklist data tag, so TACZ needs no compile-time dependency.

    // Player Animation Library (PAL) is optional at runtime. TACZ's isolated PAL 1.2.5
    // implementation replaces the unavailable KosmX API used by the 1.21.1 upstream.
    modCompileOnly "maven.modrinth:player-animation-library:${player_animation_lib}"

    // MrCrayfish's Controllable 0.26.0 and Shoulder Surfing 5.0.10 both publish
    // Fabric 26.1.2 builds. These restore upstream controller bindings/rumble and
    // adaptive shoulder-camera behavior without making either mod mandatory.
    modCompileOnly "curse.maven:controllable-317269:${controllable_curse_file}"
    modCompileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"

    // KubeJS
    // compileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    // compileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"
    // compileOnly "dev.architectury:architectury-fabric:${architectury_version}"

    // CCA (Cardinal Components API) - 26.1.2: 移除，与 Mojang 映射不兼容
    // implementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"))
    // implementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"))

    // MKB (Modern Keybinding)
    // implementation(include("maven.modrinth:modernkeybinding:1.20.X-1.2.0"))

    // Forge Config API Port - 26.1.2 compatible (ForgeConfigSpec + ForgeConfigRegistry)
    // 26.1.5 Fabric: https://github.com/Fuzss/forge-config-api-port (branch 26.1.x)
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port}"
    // 备用 (如果上面 maven 仓库不可用): curse.maven:forge-config-api-port-547434:8292030

    // ModMenu — 18.0.0-alpha.8 is the published 26.1–26.1.2 build.
    modImplementation "maven.modrinth:modmenu:${modmenu_version}"

    // Zoomify — 2.16.0+26.1 supports 26.1–26.1.2.
    modCompileOnly "maven.modrinth:zoomify:${zoomify_version}"

    // ImmediatelyFast supports 26.1.2, but its old public HUD batching API was removed.
    // TACZ's delayed GuiItemAtlas path needs no direct compile-time integration.

    // REI — 26.1.2
    modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version"

    // Spark
    // runtimeOnly "curse.maven:spark-361579:4738953"

    // Accelerated Rendering
    // implementation "maven.modrinth:accrelatedrendering-refabricated:1.0.8-1.20.1-alpha-fabric.1"
}

// The initial 26.1.2 checkout only retained the full resource tree inside its tracked sources JAR.
// Keep that compressed, immutable bundle as the fallback resource source instead of checking ~80 MiB and
// thousands of generated/default-pack files into src/main/resources a second time. Explicit source resources
// win for metadata and future hand-edited files.
def bundledSourcesAndResources = file("resources/tacz-26.1.2-source-and-resource-bundle.jar")

processResources {
    inputs.property "version", project.version
    inputs.file bundledSourcesAndResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Any file hand-written under src/main/resources overrides its bundle copy.
    // DuplicatesStrategy.EXCLUDE already makes the first spec win (the source-set
    // resources are added before this one), but relying on copy-spec ordering is
    // fragile: a bundle file that shadows a deliberate fix fails silently at runtime.
    // Enumerate the overrides and exclude them explicitly instead.
    //
    // This exists because assets/tacz/shaders/core/scope_body.vsh in the 26.1.2 bundle
    // still imports <minecraft:sample_lightmap.glsl>, an include that does not exist in
    // 1.21.11. ShaderManager NPEs on the missing import, the resource reload aborts with
    // "Caught error loading resourcepacks", and the client hangs on a black screen.
    // See docs/verify_shader_imports.py.
    def overriddenBySource = []
    def sourceResourceRoot = file("src/main/resources")
    if (sourceResourceRoot.exists()) {
        sourceResourceRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            overriddenBySource << sourceResourceRoot.toPath()
                    .relativize(f.toPath()).toString().replace(File.separator, "/")
        }
    }

    from(zipTree(bundledSourcesAndResources)) {
        exclude "META-INF/**"
        exclude "**/*.java"
        exclude "fabric.mod.json"
        exclude "*.mixins.json"
        exclude "tacz.accesswidener"
        exclude "shouldersurfing_plugin.json"
        overriddenBySource.each { exclude it }
    }
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// 1.21.11 runs on Java 21 (26.x is the Java 25 line).
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
        it.options.compilerArgs << "-Xmaxerrs" << "5000"
    }
}

// Source selection for integrations whose APIs genuinely have no 26.1.2 equivalent.
// PAL, Controllable, Shoulder Surfing and Iris are compiled above and guarded at runtime;
// only obsolete KosmX/OptiFine/KubeJS-Fabric/Accelerated Rendering implementations remain excluded.
sourceSets {
    main {
        java {
            // AR(Accelerated Rendering)：仅排除硬依赖 argon4w 的 IMPL，保留 ARCompat/BeamRenderContext 门面（改为禁用态）
            exclude 'com/tacz/guns/compat/ar/ARCompatImpl.java'
            exclude 'com/tacz/guns/compat/ar/AcceleratedBeamRenderer.java'
            // Controllable 0.26.0 now has a verified 26.1.2 Fabric build; its isolated
            // implementation is compiled again and only loaded when the mod is installed.
            // KubeJS：26.1.2 only has NeoForge builds; the Fabric event poster remains a disabled facade.
            exclude 'com/tacz/guns/compat/kubejs/**'
            // The obsolete KosmX implementation is replaced by compat/playeranimator/pal/**.
            exclude 'com/tacz/guns/compat/playeranimator/animation/**'
            exclude 'com/tacz/guns/compat/playeranimator/PlayerAnimatorAssetManager.java'
            // Optifine：非 Fabric，待评估永久废弃
            exclude 'com/tacz/guns/compat/optifine/**'
            // Carry On 2.10 uses a data-tag contract; its old Java config hook is intentionally absent.
            // Accelerated Rendering mixin：随 AR 模块禁用
            exclude 'com/tacz/guns/mixin/client/ar/**'
            // Iris：阶段 9 已恢复（2026-08-13）。Iris 改为 modCompileOnly，编译期可见，
            // mixin AP 不再报 "target could not be found"，因此这里不再排除。
            //
            // 已对 Iris 1.10.7(1.21.11) 逐条核实注入点：
            //   * ShaderCreator.link(String,String,String,String,String,String,VertexFormat,boolean) 存在；
            //   * link 内 createShader 的调用顺序为 VERTEX/GEOMETRY/TESSELATION_CONTROL/
            //     TESSELATION_EVAL/FRAGMENT，故 @ModifyArgs 的 ordinal = 4 正是 FRAGMENT；
            //   * create / createFallback / createFallbackShadow / createShadow 四条路径
            //     全部汇聚到同一个 link，patch 一处即可覆盖；
            //   * 传入的 name 是 ShaderKey.getName()，其实现为 toString().toLowerCase(ROOT)，
            //     即 HAND_CUTOUT -> "hand_cutout"，与 tacz$isHandProgram 的小写判据一致。
            //
            // 运行期仍由 IrisCompatMixinPlugin 的 isModLoaded("iris") 兜底，
            // 且 tacz.iris.mixins.json 保持 required=false，未装 Iris 的用户不受影响。
        }
    }
}

java {
    // Pin the toolchain instead of only raising it: building 1.21.11 with a JDK 25
    // toolchain would silently link against the wrong class-file/API baseline.
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-${minecraft_version}"
            from components.java
        }
    }

    repositories {
        maven {
            url "file:///D:/github_maven/Sh1roCu_MCRepo/repository"
        }
    }
}

// TEMP (step-2 PoC, renderAllFeatures @Local route): dump FeatureRenderDispatcher bytecode so the
// hand-flush RenderPass local can be located precisely. Runs after compileJava (finalizedBy);
// its stdout lands in the CI compile log. Remove before release.
tasks.register('dumpFeatureDispatcherApi') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)

        def runJavap = { String cls, List flags ->
            def cmd = ['javap', '-classpath', cp]
            flags.each { cmd << it }
            cmd << cls
            def proc = new ProcessBuilder(cmd).redirectErrorStream(false).start()
            def out = proc.inputStream.getText('UTF-8')
            def err = proc.errorStream.getText('UTF-8')
            proc.waitFor()
            return [out, err]
        }

        def methodBlocks = { String cls, List flags ->
            def (out, err) = runJavap(cls, flags)
            if (err.trim()) { println('javap stderr: ' + err.trim()); return [] }
            def blocks = []
            def cur = null
            out.readLines().each { line ->
                if (line ==~ /^  .+\(.*\);.*$/) {
                    if (cur != null) blocks << cur
                    cur = [line]
                } else if (cur != null) {
                    cur << line
                } else {
                    cur = [line]
                }
            }
            if (cur != null) blocks << cur
            return blocks
        }

        def findMethod = { List blocks, String name -> blocks.find { it[0].contains(name) } }

        println '===== net.minecraft.client.renderer.feature.FeatureRenderDispatcher -p ====='
        def (fdp, fdpe) = runJavap('net.minecraft.client.renderer.feature.FeatureRenderDispatcher', ['-p'])
        println(fdp ?: '(none)')
        if (fdpe.trim()) { println('stderr: ' + fdpe.trim()) }

        def fdBlocks = methodBlocks('net.minecraft.client.renderer.feature.FeatureRenderDispatcher', ['-c', '-p'])
        ['void renderAllFeatures', 'renderSolidFeatures', 'renderTranslucentFeatures'].each { name ->
            def b = findMethod(fdBlocks, name)
            if (b != null) {
                println "===== FeatureRenderDispatcher.${name} full (${b.size()} lines) ====="
                println b.join('\n')
            } else {
                println "===== FeatureRenderDispatcher.${name} NOT FOUND ====="
            }
        }

        def fdBlocks2 = methodBlocks('net.minecraft.client.renderer.feature.CustomFeatureRenderer', ['-c', '-p'])
        ['void render('].each { name ->
            def b = findMethod(fdBlocks2, name)
            if (b != null) {
                println "===== CustomFeatureRenderer.render full (${b.size()} lines) ====="
                println b.join('\n')
            } else {
                println '===== CustomFeatureRenderer.render NOT FOUND ====='
            }
        }

        println '===== net.minecraft.client.renderer.feature.CustomFeatureRenderer -p ====='
        def (cfr, cfre) = runJavap('net.minecraft.client.renderer.feature.CustomFeatureRenderer', ['-p'])
        println(cfr ?: '(none)')
        if (cfre.trim()) { println('stderr: ' + cfre.trim()) }

        println '===== net.minecraft.client.renderer.feature.ItemFeatureRenderer -p ====='
        def (ifr, ifre) = runJavap('net.minecraft.client.renderer.feature.ItemFeatureRenderer', ['-p'])
        println(ifr ?: '(none)')
        if (ifre.trim()) { println('stderr: ' + ifre.trim()) }

        println '===== net.minecraft.client.renderer.feature.FeatureRenderer -p ====='
        def (fr, fre) = runJavap('net.minecraft.client.renderer.feature.FeatureRenderer', ['-p'])
        println(fr ?: '(none)')
        if (fre.trim()) { println('stderr: ' + fre.trim()) }

        println '===== net.minecraft.client.renderer.SubmitNodeCollection -p ====='
        def (sncl, sncle) = runJavap('net.minecraft.client.renderer.SubmitNodeCollection', ['-p'])
        println(sncl ?: '(none)')
        if (sncle.trim()) { println('stderr: ' + sncle.trim()) }

        println '===== net.minecraft.client.renderer.MultiBufferSource$BufferSource -p ====='
        def (bss, bsse) = runJavap('net.minecraft.client.renderer.MultiBufferSource$BufferSource', ['-p'])
        println(bss ?: '(none)')
        if (bsse.trim()) { println('stderr: ' + bsse.trim()) }

        def bsb = methodBlocks('net.minecraft.client.renderer.MultiBufferSource$BufferSource', ['-c', '-p'])
        ['endBatch', 'endLastBatch', 'draw', 'flush'].each { name ->
            def b = findMethod(bsb, name)
            if (b != null) {
                println "===== MultiBufferSource\$BufferSource.${name} full (${b.size()} lines) ====="
                println b.join('\n')
            }
        }

        def (rs2, rse2) = runJavap('com.mojang.blaze3d.systems.RenderSystem', ['-p'])
        println '===== RenderSystem (filtered) ====='
        if (rs2) {
            rs2.readLines().each { line ->
                ['outputColor', 'outputDepth', 'createRenderPass', 'bindDefaultUniforms', 'getModelView',
                 'getDevice', 'getDynamicUniforms', 'getColorTextureView', 'getDepthTextureView',
                 'RenderPass'].each { n ->
                    if (line.contains(n)) println '  ' + line.trim()
                }
            }
        } else { println('(none)'); if (rse2.trim()) println('stderr: ' + rse2.trim()) }

    }
}
compileJava.finalizedBy dumpFeatureDispatcherApi
