plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")
    // From Loom 1.17: mixin AP is no longer enabled by default.
    // The legacy mixin AP requires mappings, which don't exist in 26.1+.
    // We must disable it and handle mixins differently.
    // mixin {
    //     useLegacyMixinAp = true
    //     defaultRefmapName = "tacz.refmap.json"
    // }
    runs {
        client {
            // The embedded default pack alone contains >80 MiB of textures, audio, and models.
            // 384 MiB consistently OOMs during its first resource reload under 26.1.2.
            vmArg "-Xmx768m"
            // Step 2 lens diagnostic. Enable with: gradlew runClient -PtaczScopeDebug=true
            // (The TACZ client config file does NOT contain this switch; it is a JVM property.)
            vmArg "-Dtacz.scope.pip.debug.paint=${providers.gradleProperty('taczScopeDebug').getOrElse('false')}"
            // Step 3 real scope PIP. Enable with: gradlew runClient -PtaczScopePip=true
            // (JVM property, not a config-file option; same reason as Step 2.)
            vmArg "-Dtacz.scope.pip.enable=${providers.gradleProperty('taczScopePip').getOrElse('false')}"
        }
        server {
            vmArg "-Xmx384m"
        }
        datagen {
            property "fabric-api.datagen.modid", "tacz"
        }
    }
}

repositories {
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.shedaniel.me/" } // cloth config api
    maven { url "https://dvs1.progwml6.com/files/maven/" }
    maven { url "https://modmaven.dev" }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "devOSSnapshots"
        url = uri("https://mvn.devos.one/snapshots")
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // ================================================================
    // 从 26.1+: Minecraft 不再混淆，Loom 使用未混淆模式
    // 因此不再需要 mappings 依赖
    // modImplementation → implementation (因为不再需要 mod 重映射)
    // modCompileOnly → compileOnly
    // modRuntimeOnly → runtimeOnly
    // modApi → api
    // ================================================================

    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings needed — 26.1+ uses unobfuscated Minecraft
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Opt-in compatibility run. Iris 1.11.2 + Sodium 0.9.1 are the current 26.1.2 pair.
    // Keep them out of the distributable and normal server/client runs; enable with -PwithIris.
    if (project.hasProperty("withIris")) {
        runtimeOnly "curse.maven:irisshaders-455508:${project.iris_curse_file}"
        runtimeOnly "curse.maven:sodium-394468:${project.sodium_curse_file}"
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    // ============================================================
    // 26.1.2 dependency audit. Optional integrations stay compile-only so they are
    // absent from the distributable and are guarded by FabricLoader at runtime.
    // ============================================================

    // simplebedrockmodel — the old library has no 26.1.2 build; the small API surface TACZ
    // consumes is provided by local compatibility interfaces and the collector-backed renderer.

    // MAE (Math Expression Evaluator)
    implementation(include("com.maydaymemory:mae:1.1.1")) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    // Apache Commons Math
    implementation(include('org.apache.commons:commons-math3:3.6.1'))

    // LuaJ
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // ============================================================
    // 以下为运行时/编译时 mod 依赖；无 26.1.2 构建的项保持注释
    // ============================================================

    // JEI — verified 26.1.2 Fabric release (kept on the previously compiled API line)
    compileOnly "maven.modrinth:jei:${jei_version}"

    // Cloth Config — 26.1.x
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}"

    // Embeddium
    // compileOnly "curse.maven:embeddium-908741:${embeddedt_id}"

    // Carry On 2.10.0 supports 26.1.2. Its modern compatibility contract is the
    // carryon:block_blacklist data tag, so TACZ needs no compile-time dependency.

    // Player Animation Library (PAL) is optional at runtime. TACZ's isolated PAL 1.2.5
    // implementation replaces the unavailable KosmX API used by the 1.21.1 upstream.
    compileOnly "maven.modrinth:player-animation-library:${player_animation_lib}"

    // MrCrayfish's Controllable 0.26.0 and Shoulder Surfing 5.0.10 both publish
    // Fabric 26.1.2 builds. These restore upstream controller bindings/rumble and
    // adaptive shoulder-camera behavior without making either mod mandatory.
    compileOnly "curse.maven:controllable-317269:${controllable_curse_file}"
    compileOnly "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"

    // KubeJS
    // compileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    // compileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"
    // compileOnly "dev.architectury:architectury-fabric:${architectury_version}"

    // CCA (Cardinal Components API) - 26.1.2: 移除，与 Mojang 映射不兼容
    // implementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"))
    // implementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"))

    // MKB (Modern Keybinding)
    // implementation(include("maven.modrinth:modernkeybinding:1.20.X-1.2.0"))

    // Forge Config API Port - 26.1.2 compatible (ForgeConfigSpec + ForgeConfigRegistry)
    // 26.1.5 Fabric: https://github.com/Fuzss/forge-config-api-port (branch 26.1.x)
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"
    // 备用 (如果上面 maven 仓库不可用): curse.maven:forge-config-api-port-547434:8292030

    // ModMenu — 18.0.0-alpha.8 is the published 26.1–26.1.2 build.
    implementation "maven.modrinth:modmenu:${modmenu_version}"

    // Zoomify — 2.16.0+26.1 supports 26.1–26.1.2.
    compileOnly "maven.modrinth:zoomify:${zoomify_version}"

    // ImmediatelyFast supports 26.1.2, but its old public HUD batching API was removed.
    // TACZ's delayed GuiItemAtlas path needs no direct compile-time integration.

    // REI — 26.1.2
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version"

    // Spark
    // runtimeOnly "curse.maven:spark-361579:4738953"

    // Accelerated Rendering
    // implementation "maven.modrinth:accrelatedrendering-refabricated:1.0.8-1.20.1-alpha-fabric.1"
}

// The initial 26.1.2 checkout only retained the full resource tree inside its tracked sources JAR.
// Keep that compressed, immutable bundle as the fallback resource source instead of checking ~80 MiB and
// thousands of generated/default-pack files into src/main/resources a second time. Explicit source resources
// win for metadata and future hand-edited files.
def bundledSourcesAndResources = file("resources/tacz-26.1.2-source-and-resource-bundle.jar")

processResources {
    inputs.property "version", project.version
    inputs.file bundledSourcesAndResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(zipTree(bundledSourcesAndResources)) {
        exclude "META-INF/**"
        exclude "**/*.java"
        exclude "fabric.mod.json"
        exclude "*.mixins.json"
        exclude "tacz.accesswidener"
        exclude "shouldersurfing_plugin.json"
    }
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
        it.options.compilerArgs << "-Xmaxerrs" << "5000"
    }
}

// Source selection for integrations whose APIs genuinely have no 26.1.2 equivalent.
// PAL, Controllable, Shoulder Surfing and Iris are compiled above and guarded at runtime;
// only obsolete KosmX/OptiFine/KubeJS-Fabric/Accelerated Rendering implementations remain excluded.
sourceSets {
    main {
        java {
            // AR(Accelerated Rendering)：仅排除硬依赖 argon4w 的 IMPL，保留 ARCompat/BeamRenderContext 门面（改为禁用态）
            exclude 'com/tacz/guns/compat/ar/ARCompatImpl.java'
            exclude 'com/tacz/guns/compat/ar/AcceleratedBeamRenderer.java'
            // Controllable 0.26.0 now has a verified 26.1.2 Fabric build; its isolated
            // implementation is compiled again and only loaded when the mod is installed.
            // KubeJS：26.1.2 only has NeoForge builds; the Fabric event poster remains a disabled facade.
            exclude 'com/tacz/guns/compat/kubejs/**'
            // The obsolete KosmX implementation is replaced by compat/playeranimator/pal/**.
            exclude 'com/tacz/guns/compat/playeranimator/animation/**'
            exclude 'com/tacz/guns/compat/playeranimator/PlayerAnimatorAssetManager.java'
            // Optifine：非 Fabric，待评估永久废弃
            exclude 'com/tacz/guns/compat/optifine/**'
            // Carry On 2.10 uses a data-tag contract; its old Java config hook is intentionally absent.
            // Accelerated Rendering mixin：随 AR 模块禁用
            exclude 'com/tacz/guns/mixin/client/ar/**'
        }
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-${minecraft_version}"
            from components.java
        }
    }

    repositories {
        maven {
            url "file:///D:/github_maven/Sh1roCu_MCRepo/repository"
        }
    }
}

// ================================================================
// TEMP-DIAGNOSTIC round 6 (do feature nodes capture the projection slice at
// submit time?) - REMOVE. Working hypothesis for the in-mirror absolute-view
// entities: 26.1.2 feature/entity submit nodes capture a projection
// GpuBufferSlice when they are CREATED (once per frame at extract), while the
// terrain path binds the live RenderSystem slot per pass - so the narrow pass
// draws entities with the wide/extract-time projection. The ci-log keeper
// only preserves ~175 lines of fresh output per run, so this probe prints
// ONLY: SubmitNodeStorage.submitModel/submitItem bodies, then
// ModelFeatureRenderer.renderSolid body, then RenderSystem signatures -
// in that order.
tasks.named("compileJava") {
    doLast {
        def javapBin = new File(System.getProperty("java.home"), "bin/javap").absolutePath
        File mcJar = null
        for (def cfgName in ["runtimeClasspath", "compileClasspath"]) {
            try {
                configurations.getByName(cfgName).files.each { f ->
                    if (f.name.contains("minecraft") && f.name.endsWith(".jar") && mcJar == null) mcJar = f
                }
            } catch (Throwable ignored) {
            }
        }
        if (mcJar == null) {
            println "PROBE6: no minecraft jar found on the classpath"
            return
        }
        println "=== MC6 ${mcJar.name}"
        def bodyDump = { String cls, String keepMethods ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-c", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP6-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            boolean keep = false
            println "----- BEGIN6 ${cls}"
            out.toString().eachLine { line ->
                if (line =~ /^  (public|private|protected|static|final|synchronized|net\.|java\.).*\(/) {
                    keep = (line =~ keepMethods) as boolean
                    if (keep) println line
                } else if (keep) {
                    println line
                }
            }
            println "----- END6 ${cls}"
        }
        def sigDump = { String cls ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP6-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            println "----- BEGIN6SIG ${cls}"
            println out.toString()
            println "----- END6SIG ${cls}"
        }
        bodyDump("net.minecraft.client.renderer.SubmitNodeStorage", /(submitModel\(|submitItem\(|submitCustomGeometry\()/)
        bodyDump("net.minecraft.client.renderer.feature.ModelFeatureRenderer", /(renderSolid\(|renderTranslucent\()/)
        sigDump("com.mojang.blaze3d.systems.RenderSystem")
    }
}

// ================================================================
// TEMP-DIAGNOSTIC round 5b (scope-PIP entity submission + draw-time matrix) - REMOVE.
// Round 5 answered: MV stack is per-pass (renderLevel @45-63 push+mul(viewMatrix)),
// projection slot is set by GameRenderer @297-303 (vanilla ProjectionMatrixBuffer),
// renderSolidFeatures consumes SubmitNodeStorage per pass into bufferSource.
// Still missing: (1) WHO fills SubmitNodeStorage for entities and WHEN
// (extractLevel once per frame vs per pass) - our 512b re-extract fixes the
// wide pass, so extraction-time submission is suspected; (2) which matrix the
// batched draws read at draw time (RenderSystem.getModelViewMatrix singular
// vs the Matrix4fStack). Dump extractLevel + submitModel + renderSolid +
// RenderSystem surface + a body-filtered renderLevel tail.
tasks.named("compileJava") {
    doLast {
        def javapBin = new File(System.getProperty("java.home"), "bin/javap").absolutePath
        File mcJar = null
        for (def cfgName in ["runtimeClasspath", "compileClasspath"]) {
            try {
                configurations.getByName(cfgName).files.each { f ->
                    if (f.name.contains("minecraft") && f.name.endsWith(".jar") && mcJar == null) mcJar = f
                }
            } catch (Throwable ignored) {
            }
        }
        if (mcJar == null) {
            println "PROBE5B: no minecraft jar found on the classpath"
            return
        }
        println "=== MC5B ${mcJar.name}"
        def filteredDump = { String cls, String keepMethods, String keepBody ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-c", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP5B-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            boolean keep = false
            println "----- BEGIN5B ${cls}"
            out.toString().eachLine { line ->
                if (line =~ /^  (public|private|protected|static|final|synchronized|net\.|java\.).*\(/) {
                    keep = (line =~ keepMethods) as boolean
                    if (keep) println line
                } else if (keep) {
                    if (keepBody == null || (line =~ keepBody) as boolean) println line
                }
            }
            println "----- END5B ${cls}"
        }
        def sigDump = { String cls ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP5B-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            println "----- BEGIN5B ${cls}"
            println out.toString()
            println "----- END5B ${cls}"
        }
        // renderLevel tail: only call/graph-relevant instructions (avoids the log budget).
        filteredDump("net.minecraft.client.renderer.LevelRenderer",
                /(renderLevel\(com\.mojang\.blaze3d\.resource|extractLevel\()/,
                /(invokevirtual|invokeinterface|invokedynamic|invokestatic|getfield|putfield|ldc)/)
        filteredDump("net.minecraft.client.renderer.SubmitNodeStorage",
                /(submitModel\(|submitItem\(|submitCustomGeometry\(|clear\(\()/, null)
        filteredDump("net.minecraft.client.renderer.feature.ModelFeatureRenderer",
                /(renderSolid\()/, null)
        sigDump("com.mojang.blaze3d.systems.RenderSystem")
        sigDump("net.minecraft.client.renderer.entity.EntityRenderDispatcher")
    }
}

// ================================================================
// TEMP-DIAGNOSTIC round 5 (scope-PIP in-mirror entity view-space) - REMOVE.
// On-device: with ScopePipRerender=true the narrow-FOV in-mirror world renders
// magnified correctly but ENTITIES behave as if their view space is absolute
// (not relativized to the mirror camera); 26.2 / 1.21.11 sisters do not have
// this. Static analysis says both passes get their own MV stack (renderLevel
// @45) and our narrow projection covers both channels (RenderSystem slot +
// CameraRenderState.projectionMatrix), so the missing fact must be WHERE
// entity submit nodes are created and WHICH matrices they capture. Probe:
// full bodies of LevelRenderer.renderLevel + addMainPass lambda +
// GameRenderer.renderLevel + renderItemInHand + every
// FeatureRenderDispatcher method, plus field/signature tables of
// CameraRenderState / SubmitNodeStorage / LevelRenderState.
tasks.named("compileJava") {
    doLast {
        def javapBin = new File(System.getProperty("java.home"), "bin/javap").absolutePath
        File mcJar = null
        for (def cfgName in ["runtimeClasspath", "compileClasspath"]) {
            try {
                configurations.getByName(cfgName).files.each { f ->
                    if (f.name.contains("minecraft") && f.name.endsWith(".jar") && mcJar == null) mcJar = f
                }
            } catch (Throwable ignored) {
            }
        }
        if (mcJar == null) {
            println "PROBE5: no minecraft jar found on the classpath"
            return
        }
        println "=== MC5 ${mcJar.name}"
        def fullDump = { String cls, String keepWhat ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-c", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP5-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            boolean keep = false
            println "----- BEGIN5 ${cls}"
            out.toString().eachLine { line ->
                if (line =~ /^  (public|private|protected|static|final|synchronized|net\.|java\.).*\(/) {
                    keep = (line =~ keepWhat) as boolean
                    if (keep) println line
                } else if (keep) {
                    println line
                }
            }
            println "----- END5 ${cls}"
        }
        def sigDump = { String cls ->
            def out = new StringBuilder()
            def err = new StringBuilder()
            def proc = [javapBin, "-p", "-classpath", mcJar.absolutePath, cls].execute()
            proc.consumeProcessOutput(out, err)
            proc.waitFor()
            if (err.length() > 0 && out.length() == 0) {
                println "JAVAP5-ERR ${cls}: ${err.toString().trim()}"
                return
            }
            println "----- BEGIN5SIG ${cls}"
            println out.toString()
            println "----- END5SIG ${cls}"
        }
        fullDump("net.minecraft.client.renderer.LevelRenderer",
                /(renderLevel\(com\.mojang\.blaze3d\.resource|lambda.addMainPass)/)
        fullDump("net.minecraft.client.renderer.GameRenderer",
                /(renderLevel\(net\.minecraft\.client\.DeltaTracker|renderItemInHand\(net\.minecraft)/)
        fullDump("net.minecraft.client.renderer.feature.FeatureRenderDispatcher", /.*/)
        sigDump("net.minecraft.client.renderer.state.level.CameraRenderState")
        sigDump("net.minecraft.client.renderer.SubmitNodeStorage")
        sigDump("net.minecraft.client.renderer.state.level.LevelRenderState")
    }
}
